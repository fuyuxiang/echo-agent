name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the pinned ruff from the dev extra instead of a bare
      # `pip install ruff` (which floats to the latest release). This keeps the
      # ruff version in one place — [project.optional-dependencies] dev — so CI
      # and local `pip install -e ".[dev]"` always run the same linter.
      - name: Install ruff (pinned via dev extra)
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      # scripts/install.sh is how most users get Echo Agent, yet it had no
      # automated checking of any kind. shellcheck is preinstalled on the
      # ubuntu runners. -x follows sourced files; SC1091 would otherwise flag
      # files that only exist on a user's machine.
      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh; do
            echo "== $f"
            bash -n "$f"
            shellcheck -x -e SC1091 "$f"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run tests
        # --cov activates the coverage gate (fail_under) defined in pyproject.toml,
        # so a drop below the baseline fails CI instead of passing silently.
        run: python -m pytest tests/ -v --cov

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (core + dev) and pip-audit
        run: |
          # setuptools/wheel are venv bootstrap tools, not project deps; upgrade
          # them so pip-audit isn't flagged by CVEs in the runner's stale version.
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  # The Dashboard SPA is built from source by scripts/install.sh (and by
  # scripts/publish.sh when producing the wheel), so a broken web/ breaks user
  # installs. Nothing in CI compiled the frontend before this job: TypeScript
  # errors and a lockfile drifting out of sync with package.json both landed on
  # master with CI fully green.
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scripts/install.sh bootstraps pnpm via corepack or `npm i -g pnpm`, so
        # whatever major is current on the user's machine is what runs. Pinning
        # CI to one major hid a real breakage: pnpm 11 flipped strictDepBuilds to
        # true, turning an unapproved dependency build script into a hard
        # ERR_PNPM_IGNORED_BUILDS failure, and users hit it while CI stayed
        # green on 10. Test the pinned major and the next one.
        pnpm-version: [10, 11]
    env:
      # Stop pnpm from honouring package.json's "packageManager" pin and
      # re-downloading pnpm 10, which would collapse both matrix legs onto the
      # same version and defeat this job. The setting was renamed in v11
      # (managePackageManagerVersions -> pmOnFail), so set both names: pnpm
      # ignores an unknown *config* variable, unlike an unknown CLI flag.
      npm_config_manage_package_manager_versions: "false"
      pnpm_config_pm_on_fail: "ignore"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Show pnpm version actually in use
        working-directory: web
        run: pnpm --version

      # Mirrors what the installer does. No fallback to a loose `pnpm install`:
      # web/package.json pins nothing (all caret ranges), so the lockfile is the
      # only thing keeping the build reproducible, and drift must fail here
      # rather than on each user's machine.
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        working-directory: web
        run: pnpm build

      - name: Verify build output
        run: test -f web/dist/index.html

      - name: Run frontend tests
        working-directory: web
        run: pnpm test --run
