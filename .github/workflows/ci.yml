name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Every job only needs to read the checked-out repository. Keep the default
# GITHUB_TOKEN read-only so adding a third-party step cannot silently widen it.
permissions:
  contents: read

defaults:
  run:
    working-directory: echo-agent-runtime

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Install the pinned ruff from the dev extra instead of a bare
      # `pip install ruff` (which floats to the latest release). This keeps the
      # ruff version in one place — [project.optional-dependencies] dev — so CI
      # and local `pip install -e ".[dev]"` always run the same linter.
      - name: Install ruff (pinned via dev extra)
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check . ../scripts --config pyproject.toml

      # scripts/install.sh is how most users get Echo Agent, yet it had no
      # automated checking of any kind. shellcheck is preinstalled on the
      # ubuntu runners. -x follows sourced files; SC1091 would otherwise flag
      # files that only exist on a user's machine.
      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh ../scripts/*.sh; do
            echo "== $f"
            bash -n "$f"
            shellcheck -x -e SC1091 "$f"
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: echo-agent-runtime/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: echo-agent-runtime/pyproject.toml

      - name: Install project (all extras + dev) and pip-audit
        run: |
          # setuptools/wheel are venv bootstrap tools, not project deps; upgrade
          # them so pip-audit isn't flagged by CVEs in the runner's stale version.
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]" pip-audit

      - name: Audit all installed Python dependencies
        # The project itself is an unpublished editable checkout; skip only that
        # local entry while auditing every installed direct/transitive dependency.
        run: pip-audit --skip-editable

      - name: Audit vendored Python components
        # Audit upstream FastEmbed itself without resolving its old Pillow cap.
        # The compatibility copy's complete dependency graph was audited above.
        run: pip-audit -r ../.github/requirements-vendored.txt --no-deps --disable-pip

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "10.34.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Audit production Dashboard dependencies
        # Keep runtime findings visible separately from the complete toolchain.
        working-directory: echo-agent-runtime/web
        run: pnpm audit --prod --audit-level=high

      - name: Audit Dashboard build and test dependencies
        working-directory: echo-agent-runtime/web
        # Mock-server file disclosure/code injection advisories can be moderate.
        run: pnpm audit --audit-level=moderate

  # The Dashboard SPA is built by the source installer and release builds;
  # a broken web/ therefore reaches both source and package users.
  # Nothing in CI compiled the frontend before this job: TypeScript errors and
  # a lockfile drifting out of sync with package.json both landed on master with
  # CI fully green.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The on-demand builder accepts an existing pnpm or bootstraps a pinned
        # fallback. Testing the current supported majors catches lockfile and
        # dependency-build-policy differences before users hit them.
        pnpm-version: [10, 11]
    env:
      # Stop pnpm from honouring package.json's "packageManager" pin and
      # re-downloading pnpm 10, which would collapse both matrix legs onto the
      # same version and defeat this job. The setting was renamed in v11
      # (managePackageManagerVersions -> pmOnFail), so set both names: pnpm
      # ignores an unknown *config* variable, unlike an unknown CLI flag.
      npm_config_manage_package_manager_versions: "false"
      pnpm_config_pm_on_fail: "ignore"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ matrix.pnpm-version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: echo-agent-runtime/web/pnpm-lock.yaml

      - name: Show pnpm version actually in use
        working-directory: echo-agent-runtime/web
        run: pnpm --version

      # Mirrors what the installer does. No fallback to a loose `pnpm install`:
      # web/package.json pins nothing (all caret ranges), so the lockfile is the
      # only thing keeping the build reproducible, and drift must fail here
      # rather than on each user's machine.
      - name: Install frontend dependencies
        working-directory: echo-agent-runtime/web
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        working-directory: echo-agent-runtime/web
        run: pnpm build

      - name: Verify build output
        run: test -f web/dist/index.html

      - name: Run frontend tests
        working-directory: echo-agent-runtime/web
        run: pnpm test --run

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e "./echo-agent-runtime[docs,dev]"

      - name: Generate config reference
        run: python -m echo_agent.config.docgen --output-dir docs/reference --lang both

      - name: Check documentation against Runtime
        run: python -m pytest scripts/tests/ -v

      - name: Build docs (strict)
        run: mkdocs build --strict

  # Exercise the complete release path without publishing: build the Dashboard,
  # produce an sdist and a wheel from it, inspect both archives, then install and
  # execute the wheel outside the checkout. This catches packaging-hook and
  # MANIFEST regressions that editable installs and the Dashboard job cannot.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ../echo-agent-runtime-isolated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy only Runtime outside the repository
        working-directory: .
        run: |
          python3 - <<'PY'
          import shutil
          shutil.copytree(
              "echo-agent-runtime", "../echo-agent-runtime-isolated",
              ignore=shutil.ignore_patterns(".git", ".venv", "venv", "node_modules", "dist", "__pycache__"),
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: echo-agent-runtime/pyproject.toml

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "10.34.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: echo-agent-runtime/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ../echo-agent-runtime-isolated/web
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        working-directory: ../echo-agent-runtime-isolated/web
        run: pnpm build

      - name: Build sdist and wheel from the sdist
        run: |
          python -m pip install --upgrade pip build
          bash scripts/build.sh --prebuilt-dashboard

      - name: Install wheel and run smoke checks
        run: |
          SMOKE_VENV="${RUNNER_TEMP}/echo-agent-wheel-smoke"
          python -m venv "$SMOKE_VENV"
          for smoke_wheel in dist/*.whl; do
            "$SMOKE_VENV/bin/python" -m pip install "${smoke_wheel}[openai]"
          done
          "$SMOKE_VENV/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$SMOKE_VENV/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from echo_agent import __version__
          from echo_agent._vendor.fastembed import TextEmbedding
          from echo_agent._vendor.fastembed.rerank.cross_encoder import TextCrossEncoder

          dashboard = files("echo_agent").joinpath("_bundled/dashboard/index.html")
          if not dashboard.is_file():
              raise SystemExit(f"installed wheel is missing Dashboard: {dashboard}")
          for resource in (
              "_bundled/skills/productivity/calendar/scripts/calendar_client.py",
              "config/default.yaml",
              "gateway/static/index.html",
          ):
              if not files("echo_agent").joinpath(resource).is_file():
                  raise SystemExit(f"installed wheel is missing resource: {resource}")
          installed_version = version("echo-agent")
          if __version__ != installed_version:
              raise SystemExit(
                  f"echo_agent.__version__={__version__!r} does not match "
                  f"installed metadata {installed_version!r}"
              )
          print(f"installed echo-agent {installed_version} with Dashboard")
          print(f"Bundled inference backends: {TextEmbedding.__name__}, {TextCrossEncoder.__name__}")
          PY
          "$SMOKE_VENV/bin/echo-agent" --help >/dev/null
          "$SMOKE_VENV/bin/python" "$GITHUB_WORKSPACE/echo-agent-runtime/scripts/validate-server-process.py" \
            --output "$RUNNER_TEMP/echo-agent-process-smoke"

      - name: Install the standalone source archive without frontend tools
        run: |
          ARCHIVE_DIR="${RUNNER_TEMP}/echo-agent-runtime-extracted"
          mkdir -p "$ARCHIVE_DIR"
          for runtime_archive in dist/echo-agent-runtime-*.tar.gz; do
            tar -xzf "$runtime_archive" -C "$ARCHIVE_DIR"
          done
          test -f "$ARCHIVE_DIR/echo-agent-runtime/web/package.json"
          test -f "$ARCHIVE_DIR/echo-agent-runtime/web/dist/index.html"
          test ! -e "$ARCHIVE_DIR/client"
          test ! -e "$ARCHIVE_DIR/docs"
          SMOKE_VENV="${RUNNER_TEMP}/echo-agent-wheel-smoke"
          "$SMOKE_VENV/bin/python" -m pip install --no-deps "$ARCHIVE_DIR/echo-agent-runtime"
          "$SMOKE_VENV/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$SMOKE_VENV/bin/python" "$GITHUB_WORKSPACE/echo-agent-runtime/scripts/validate-server-process.py" \
            --output "$RUNNER_TEMP/echo-agent-source-process-smoke"

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-agent-dist
          path: ../echo-agent-runtime-isolated/dist/*
          if-no-files-found: error
          retention-days: 7
