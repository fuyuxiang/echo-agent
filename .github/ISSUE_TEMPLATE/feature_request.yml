name: 功能请求 / Feature Request
description: 建议一个新功能或改进 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或动机 / Problem or Motivation
      description: 这个功能要解决什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你期望如何解决？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives Considered
      description: 考虑过哪些替代方案？

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 截图、链接或其他上下文
