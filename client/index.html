<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <title>EchoAgent</title>
    <script>
      // Set the saved theme before styles and React load so startup never paints
      // a light frame for users who selected dark mode.
      (() => {
        let theme = "light";
        try {
          const saved = localStorage.getItem("echoagent.theme");
          if (saved === "dark" || saved === "light") theme = saved;
          else if (saved === "system" && typeof window.matchMedia === "function") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
        } catch (_) {
          // Storage may be unavailable in a restricted WebView; light is safe.
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <!--
      Global base layer — ported from echo-agent/renderer/index.html.
      EchoAgent injects VS Code theme variables from the host; here we hardcode
      the fallbacks so the page renders standalone in the Tauri webview.
      Actual design tokens (--echo-*) live in src/styles/tokens.css, loaded from main.tsx.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: var(--echo-bg-primary, #fcfdfc);
        color: var(--echo-text-strong, #242927);
        font-family: var(
          --vscode-font-family,
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif
        );
        font-size: var(--vscode-font-size, 13px);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html[data-theme="dark"] body {
        background-color: var(--echo-bg-primary, #1d2220);
        color: var(--echo-text-strong, #e6eae8);
      }

      .echo-startup-fallback {
        height: 100%;
        display: grid;
        place-items: center;
        background: var(--echo-bg-primary, #fcfdfc);
        color: var(--echo-text-medium, #505954);
        font-size: 14px;
      }

      html[data-theme="dark"] .echo-startup-fallback {
        background: var(--echo-bg-primary, #1d2220);
        color: var(--echo-text-medium, #b4bdb8);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(
          --vscode-scrollbarSlider-background,
          var(--echo-scrollbar-thumb, rgba(100, 100, 100, 0.4))
        );
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(
          --vscode-scrollbarSlider-hoverBackground,
          var(--echo-scrollbar-thumb-hover, rgba(100, 100, 100, 0.7))
        );
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: var(
          --vscode-scrollbarSlider-activeBackground,
          var(--echo-scrollbar-thumb-hover, rgba(100, 100, 100, 0.7))
        );
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Kept visible until React's first successful commit. If the bundle or
           WebView initialization fails, Windows users see a status instead of
           an undiagnosable white surface. -->
      <div class="echo-startup-fallback" role="status">正在启动 EchoAgent…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
