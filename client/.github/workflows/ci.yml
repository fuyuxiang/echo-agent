name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-stability:
    name: Desktop recovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/stability-check -> target
          cache-on-failure: 'true'
      - run: pnpm install --frozen-lockfile
      - name: Validate native review guards without launching desktop tasks
        if: runner.os == 'macOS'
        run: pnpm test:native-guards
      - run: pnpm test:stability
      - run: pnpm test:stability:native
        env:
          STABILITY_EVIDENCE_DIR: ${{ runner.temp }}/desktop-stability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-stability-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-stability
          if-no-files-found: ignore

  dependency-security:
    name: Dependency security / frontend, IDE and Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s scripts -p 'test_audit_dependencies.py'
      - run: python3 scripts/audit-dependencies.py --output security-audit-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-security
          path: security-audit-results
          if-no-files-found: ignore

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: node scripts/verify-vendored-runtime.mjs
      - run: node scripts/release-version.mjs check
      - run: bash -n scripts/build.sh scripts/prepare-update-artifacts.sh scripts/publish-update.sh scripts/publish-all-updates.sh
      - run: python3 -m unittest discover -s deploy/update-server -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_setup_protoc.py'
      - run: python3 -m unittest discover -s scripts -p 'test_extract_meeting_speech.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm icons:check
      - name: Require audit coverage for every Rust lockfile
        run: node --test scripts/test-rust-audit-coverage.mjs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run frontend and script unit tests
        id: unit_tests
        run: pnpm test --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit="${{ runner.temp }}/echo-unit-tests.xml"
      - run: pnpm test:scripts
      - run: pnpm office:test
      - name: Preserve unit test report
        if: ${{ always() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-linux
          path: ${{ runner.temp }}/echo-unit-tests.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated production startup tools
        run: |
          npm install --prefix "$RUNNER_TEMP/production-startup-tools" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/production-startup-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify built application startup
        run: pnpm test:production-startup
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/production-startup-tools/node_modules/playwright/index.mjs
          PRODUCTION_SMOKE_OUTPUT: ${{ runner.temp }}/production-startup-evidence
      - name: Preserve production startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-startup
          path: ${{ runner.temp }}/production-startup-evidence
          if-no-files-found: ignore

  app-icons:
    name: App icons / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - name: Verify reproducible generation and Windows text checkouts
        run: pnpm test:icons
      - name: Install isolated icon review tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/app-icons-review-tools" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/app-icons-review-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify icon artwork and waiting lifecycle
        run: pnpm test:ui:app-icons
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/app-icons-review-tools/node_modules/playwright/index.mjs
          UI_REVIEW_OUTPUT: ${{ runner.temp }}/app-icons-evidence
      - name: Verify model settings navigation and action hit targets
        run: pnpm test:ui:settings-actions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/app-icons-review-tools/node_modules/playwright/index.mjs
          UI_REVIEW_OUTPUT: ${{ runner.temp }}/app-icons-evidence
      - name: Preserve icon screenshots and checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-icons-${{ matrix.os }}
          path: ${{ runner.temp }}/app-icons-evidence
          if-no-files-found: ignore

  ui-checks:
    name: UI / ${{ matrix.suite }}
    # Playwright 1.55 supports Ubuntu 24.04. Do not silently migrate the
    # browser/font baseline when ubuntu-latest changes to another release.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: design
            command: node scripts/validate-design-system.mjs
          - suite: themes
            command: pnpm test:ui:theme-states
          - suite: theme-lifecycle
            command: pnpm test:ui:theme-lifecycle
          - suite: contrast
            command: pnpm test:ui:contrast
          - suite: raster
            command: pnpm test:ui:contrast:complex
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser review tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-contract-tools" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/ui-contract-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify ${{ matrix.suite }}
        run: ${{ matrix.command }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ui-contract-tools/node_modules/playwright/index.mjs
          UI_REVIEW_OUTPUT: ${{ runner.temp }}/ui-contract-evidence/${{ matrix.suite }}
      - name: Preserve UI assertions, screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-contract-evidence-${{ matrix.suite }}
          path: ${{ runner.temp }}/ui-contract-evidence
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing status name for branch protection. A partial matrix
  # or a skipped suite cannot produce a successful aggregate check.
  ui-contracts:
    name: UI behavior, themes and rendered contrast
    needs: ui-checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every UI suite to pass
        run: test '${{ needs.ui-checks.result }}' = 'success'

  mermaid-render:
    name: Mermaid rendering / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser review tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mermaid-review-tools" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/mermaid-review-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify production diagrams and native macOS WKWebView
        run: pnpm test:mermaid
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/mermaid-review-tools/node_modules/playwright/index.mjs
          UI_REVIEW_OUTPUT: ${{ runner.temp }}/mermaid-render-evidence
      - name: Preserve diagram screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mermaid-render-${{ matrix.os }}
          # Preserve review assets without uploading the large Swift module cache.
          path: |
            ${{ runner.temp }}/mermaid-render-evidence/*.png
            ${{ runner.temp }}/mermaid-render-evidence/*.svg
            ${{ runner.temp }}/mermaid-render-evidence/*geometry*.json
          if-no-files-found: ignore

  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  fast-checks:
    name: Fast checks
    needs: [typecheck, unit, rustfmt]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require type checks, unit tests and Rust formatting
        run: |
          test '${{ needs.typecheck.result }}' = success
          test '${{ needs.unit.result }}' = success
          test '${{ needs.rustfmt.result }}' = success

  rust:
    runs-on: ubuntu-24.04
    env:
      NATIVE_TEST_OUTPUT: ci-artifacts/native-tests
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      # Match vendor/echo-agent-build/bin/protoc; older distro compilers do not
      # understand the built-in debug_redact option used by the vendored tests.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verified pinned protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: 'true'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - run: node scripts/verify-vendored-runtime.mjs
        id: verify_runtime
      - name: Check Rust warnings and lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - name: Run isolated Rust unit and integration tests
        if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
        run: node scripts/test-rust-desktop.mjs
      - name: Verify the vendored protoc locator
        if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
        run: cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml -p echo-agent-proto-build --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Run isolated memory library unit tests
        if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
        run: node scripts/test-rust-memory.mjs
      - name: Verify Runtime recovery and tool reminder contracts
        if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
        run: node scripts/test-rust-runtime.mjs
      - name: Validate compatible memory-safety backports
        if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
        run: |
          cargo test --manifest-path vendor/glib/Cargo.toml --release variant_iter
          cargo test --manifest-path vendor/lru-0.12/Cargo.toml --test security
          cargo test --manifest-path vendor/lru-0.16/Cargo.toml --test security

      - name: Preserve complete native test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-${{ github.job }}-${{ runner.arch }}
          path: ci-artifacts/native-tests
          if-no-files-found: ignore

  automation-macos:
    name: Native Runtime / macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Keep full assertions while fitting both hosted macOS architectures.
    env:
      NATIVE_TEST_OUTPUT: ci-artifacts/native-tests
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify native runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_RUNTIME_ARCH)"
        env:
          EXPECTED_RUNTIME_ARCH: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verified pinned protoc
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: 'true'
      - name: Verify the macOS protoc locator
        run: cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml -p echo-agent-proto-build --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Run all isolated native unit and integration tests
        run: node scripts/test-rust-desktop.mjs
      - name: Verify isolated Runtime, MCP and resident skill reload without a model call
        run: node scripts/test-runtime-smoke.mjs
      - name: Verify memory checkpoint and cancellation with a stalled local model
        run: node scripts/test-memory-shutdown.mjs

      - name: Preserve complete native test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-${{ github.job }}-${{ runner.arch }}
          path: ci-artifacts/native-tests
          if-no-files-found: ignore

  runtime-libraries-macos:
    name: Runtime libraries / macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Building both Cargo workspaces in the host job exceeded its budget on
    # cold Intel runners. Keep the complete library suites in their own job.
    env:
      NATIVE_TEST_OUTPUT: ci-artifacts/native-tests
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify native runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_RUNTIME_ARCH)"
        env:
          EXPECTED_RUNTIME_ARCH: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verified pinned protoc
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: 'true'
      # The dependency's own tests include macOS FSEvents path aliases and
      # remain required on both architectures alongside the host tests.
      - name: Verify Runtime configuration watching and tool reminder contracts
        run: node scripts/test-rust-runtime.mjs
      - name: Preserve complete native test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-${{ github.job }}-${{ runner.arch }}
          path: ci-artifacts/native-tests
          if-no-files-found: ignore

  meeting-speech-windows:
    name: Meeting speech / Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Verify pinned speech resources, native worker and offline inference
        shell: powershell
        run: |
          . ./scripts/windows-packaging.ps1
          $null = Initialize-PackagingMsvc
          Invoke-PackagingCommand node @('scripts/test-meeting-speech-runtime.mjs')
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

  automation-windows:
    name: Native Runtime / Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NATIVE_TEST_OUTPUT: ci-artifacts/native-tests
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify native runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, 'x64')"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verified pinned protoc
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: 'true'
      - name: Verify the Windows protoc locator
        run: cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml -p echo-agent-proto-build --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Run all isolated native unit and integration tests
        run: node scripts/test-rust-desktop.mjs
      - name: Verify isolated Runtime, MCP and resident skill reload without a model call
        run: node scripts/test-runtime-smoke.mjs
      - name: Verify memory checkpoint and cancellation with a stalled local model
        run: node scripts/test-memory-shutdown.mjs

      - name: Preserve complete native test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-${{ github.job }}-${{ runner.arch }}
          path: ci-artifacts/native-tests
          if-no-files-found: ignore

  windows-packaging-guards:
    name: Windows packaging / ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      # Step-level shell does not support expressions; select fixed-shell steps instead.
      - name: Verify native warnings, failure handling and literal checkout paths (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/test-windows-packaging.ps1
      - name: Verify native warnings, failure handling and literal checkout paths (PowerShell Core)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/test-windows-packaging.ps1

  windows-installer-shortcuts:
    name: Windows installer shortcut recovery
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install NSIS for the production shortcut fixture
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
      - name: Verify shortcut recovery without building the application
        shell: powershell
        run: ./scripts/test-windows-installer-shortcuts.ps1
        env:
          ECHO_SHORTCUT_TEST_OUTPUT: ${{ runner.temp }}/windows-shortcut-evidence
      - name: Preserve shortcut compiler, fixture and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-shortcut-evidence
          path: ${{ runner.temp }}/windows-shortcut-evidence
          if-no-files-found: ignore

  windows-native-addons:
    name: Windows native addons / Node ${{ matrix.node }}
    # node-gyp 11 and the locked node-pty build use the VS 2022/v143 toolchain.
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vendor/theia-platform/package-lock.json
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Compile locked drive and terminal addons with the release toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/windows-packaging.ps1
          $vcvars = Initialize-PackagingMsvc
          Write-Host "Using $vcvars"
          Invoke-PackagingCommand npm @('ci', '--prefix', 'vendor/theia-platform', '--ignore-scripts', '--no-audit', '--no-fund')
          Invoke-PackagingCommand node @('scripts/validate-windows-native-addons.mjs')
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

  windows-search-bundle:
    name: Windows built-in tool reliability
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell release script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verified pinned protoc
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/echo-agent-build -> target
          cache-on-failure: 'true'
      # Release profile activates the automatic rg.exe download, pinned hash
      # verification, ZIP extraction and include_bytes! path. The test then
      # executes that embedded binary after runtime extraction.
      - name: Build and execute bundled rg.exe
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-tools
          implementations::echo_agent_build::grep::tests::tool_grep_finds_matches
      - name: Verify parallel tool stream recovery on Windows
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-sampler
          ambiguous_parallel_tools_retry_once_with_parallel_disabled

  theia-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: vendor/theia-platform/package-lock.json
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - uses: actions/cache@v6.1.0
        with:
          path: |
            vendor/theia-platform/packages/*/lib
            vendor/theia-platform/packages/*/tsconfig.tsbuildinfo
          key: theia-types-${{ runner.os }}-${{ hashFiles('vendor/theia-platform/package-lock.json', 'vendor/theia-platform/packages/**/*.ts', 'vendor/theia-platform/dev-packages/**/*.ts', 'vendor/theia-platform/configs/*.json') }}
      - run: npm ci --prefix vendor/theia-platform
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Script-level filesystem tests import the root TypeScript dependency.
      - run: pnpm install --frozen-lockfile
      - name: Verify native dependency platform metadata
        run: node vendor/theia-platform/scripts/verify-lockfile-platforms.js
      - run: node --test scripts/test-theia-archive-security.mjs scripts/test-dependency-patches.mjs scripts/test-dependency-runtime-security.mjs scripts/test-theia-scanoss.mjs
      - run: node scripts/check-theia-bridge.mjs
      - name: Compile IDE contracts
        working-directory: vendor/theia-platform
        run: node node_modules/typescript/bin/tsc -b packages/ai-vercel-ai packages/ai-chat-ui packages/scm packages/plugin-ext packages/core packages/filesystem packages/file-search dev-packages/request
      - name: Verify IDE streams, RPC, filesystem and access control
        run: pnpm test:ide:unit
        env:
          THEIA_UNIT_OUTPUT_DIR: ${{ runner.temp }}/theia-unit-results
      - name: Upload IDE contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theia-unit-results
          path: ${{ runner.temp }}/theia-unit-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify pinned IDE plugins and SCM command completion
        run: |
          node scripts/manage-theia-vsix.mjs stage
          pnpm test:ide
