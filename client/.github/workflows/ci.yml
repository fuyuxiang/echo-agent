name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-stability:
    name: Desktop recovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/stability-check -> target
      - run: pnpm install --frozen-lockfile
      - name: Validate native review guards without launching desktop tasks
        if: runner.os == 'macOS'
        run: pnpm test:native-guards
      - run: pnpm test:stability
      - run: pnpm test:stability:native
        env:
          STABILITY_EVIDENCE_DIR: ${{ runner.temp }}/desktop-stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-stability-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-stability
          if-no-files-found: ignore

  dependency-security:
    name: Dependency security / frontend, IDE and Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s scripts -p 'test_audit_dependencies.py'
      - run: python3 scripts/audit-dependencies.py --output security-audit-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: security-audit-results
          if-no-files-found: ignore

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: node scripts/verify-vendored-runtime.mjs
      - run: node scripts/release-version.mjs check
      - run: bash -n scripts/build.sh scripts/prepare-update-artifacts.sh scripts/publish-update.sh scripts/publish-all-updates.sh
      - run: python3 -m unittest discover -s deploy/update-server -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm office:test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated production startup tools
        run: |
          npm install --prefix "$RUNNER_TEMP/production-startup-tools" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/production-startup-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify built application startup
        run: pnpm test:production-startup
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/production-startup-tools/node_modules/playwright/index.mjs
          PRODUCTION_SMOKE_OUTPUT: ${{ runner.temp }}/production-startup-evidence
      - name: Preserve production startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-startup
          path: ${{ runner.temp }}/production-startup-evidence
          if-no-files-found: ignore

  mermaid-render:
    name: Mermaid rendering / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser review tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mermaid-review-tools" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/mermaid-review-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify production diagrams and native macOS WKWebView
        run: pnpm test:mermaid
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/mermaid-review-tools/node_modules/playwright/index.mjs
          UI_REVIEW_OUTPUT: ${{ runner.temp }}/mermaid-render-evidence
      - name: Preserve diagram screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-render-${{ matrix.os }}
          # Preserve review assets without uploading the large Swift module cache.
          path: |
            ${{ runner.temp }}/mermaid-render-evidence/*.png
            ${{ runner.temp }}/mermaid-render-evidence/*.svg
            ${{ runner.temp }}/mermaid-render-evidence/*geometry*.json
          if-no-files-found: ignore

  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - run: node scripts/verify-vendored-runtime.mjs
      - name: Check Rust warnings and lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - name: Run isolated Rust unit and integration tests
        run: node scripts/test-rust-desktop.mjs
      - name: Verify the vendored protoc locator
        run: cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml -p echo-agent-proto-build --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Verify authentication with the patched cryptography backend
        run: |
          mkdir -p "$ECHO_AGENT_HOME" "$GROK_HOME"
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          # GitHub treats env keys case-insensitively; set the lowercase alias in the shell.
          export no_proxy="$NO_PROXY"
          cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml \
          -p echo-agent-runtime --lib auth:: -j 2
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
          ECHO_AGENT_HOME: ${{ runner.temp }}/echo-auth-tests
          GROK_HOME: ${{ runner.temp }}/echo-auth-tests-legacy
          NO_PROXY: '*'
      - name: Validate compatible memory-safety backports
        run: |
          cargo test --manifest-path vendor/glib/Cargo.toml --release variant_iter
          cargo test --manifest-path vendor/lru-0.12/Cargo.toml --test security
          cargo test --manifest-path vendor/lru-0.16/Cargo.toml --test security

  automation-macos:
    name: Native Runtime / macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Keep full assertions while fitting both hosted macOS architectures.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify native runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_RUNTIME_ARCH)"
        env:
          EXPECTED_RUNTIME_ARCH: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify the macOS protoc locator
        run: cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml -p echo-agent-proto-build --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Run all isolated native unit and integration tests
        run: node scripts/test-rust-desktop.mjs
      - name: Verify isolated Runtime, MCP and resident skill reload without a model call
        run: node scripts/test-runtime-smoke.mjs

  automation-windows:
    name: Native Runtime / Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify native runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, 'x64')"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify the Windows protoc locator
        run: cargo test --locked --manifest-path vendor/echo-agent-build/Cargo.toml -p echo-agent-proto-build --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Run all isolated native unit and integration tests
        run: node scripts/test-rust-desktop.mjs
      - name: Verify isolated Runtime, MCP and resident skill reload without a model call
        run: node scripts/test-runtime-smoke.mjs

  windows-packaging-guards:
    name: Windows packaging / ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      # Step-level shell does not support expressions; select fixed-shell steps instead.
      - name: Verify native warnings, failure handling and literal checkout paths (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/test-windows-packaging.ps1
      - name: Verify native warnings, failure handling and literal checkout paths (PowerShell Core)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/test-windows-packaging.ps1

  windows-search-bundle:
    name: Windows built-in tool reliability
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell release script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          # setup-protoc queries the GitHub Releases API. Authenticate those
          # read-only requests so shared runner IP rate limits cannot break CI.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/echo-agent-build -> target
      # Release profile activates the automatic rg.exe download, pinned hash
      # verification, ZIP extraction and include_bytes! path. The test then
      # executes that embedded binary after runtime extraction.
      - name: Build and execute bundled rg.exe
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-tools
          implementations::echo_agent_build::grep::tests::tool_grep_finds_matches
      - name: Verify parallel tool stream recovery on Windows
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-sampler
          ambiguous_parallel_tools_retry_once_with_parallel_disabled

  theia-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: vendor/theia-platform/package-lock.json
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - uses: actions/cache@v4
        with:
          path: |
            vendor/theia-platform/packages/*/lib
            vendor/theia-platform/packages/*/tsconfig.tsbuildinfo
          key: theia-types-${{ runner.os }}-${{ hashFiles('vendor/theia-platform/package-lock.json', 'vendor/theia-platform/packages/**/*.ts', 'vendor/theia-platform/configs/*.json') }}
      - run: npm ci --prefix vendor/theia-platform
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node --test scripts/test-theia-archive-security.mjs scripts/test-dependency-patches.mjs scripts/test-theia-scanoss.mjs
      - run: node scripts/check-theia-bridge.mjs
      - name: Verify AI SDK streams and SCM diffs
        working-directory: vendor/theia-platform
        run: |
          node node_modules/typescript/bin/tsc -b packages/ai-vercel-ai packages/ai-chat-ui packages/scm packages/plugin-ext
          node node_modules/mocha/bin/mocha.js --config configs/mocharc.yml packages/ai-vercel-ai/lib/node/vercel-ai-language-model.spec.js packages/ai-chat-ui/lib/browser/chat-response-renderer/toolcall-part-renderer.spec.js packages/scm/lib/browser/dirty-diff/diff-computer.spec.js
      - name: Verify pinned IDE plugins and SCM command completion
        run: |
          node scripts/manage-theia-vsix.mjs stage
          node --test scripts/test-theia-plugin-validation.mjs scripts/test-theia-scm-command.mjs scripts/test-theia-git-windowless.mjs
