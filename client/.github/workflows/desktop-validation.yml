name: desktop-validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: &packaging-paths
      - '.github/workflows/desktop-validation.yml'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'index.html'
      - 'app-icon.png'
      - 'public/**'
      # Validate every installer input, including platform config, embedded
      # Runtime/IDE source and scripts included by the native validation code.
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths: *packaging-paths
permissions:
  contents: read
concurrency:
  group: desktop-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaged-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: darwin-aarch64
          - os: macos-15-intel
            arch: x86_64
            target: darwin-x86_64
          # The locked native addons require VS 2022; windows-latest uses VS 2026.
          - os: windows-2022
            arch: x64
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Verify native packaging architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ runner.os == 'Windows' && '24.22.1' || '22.23.4' }}
          cache: pnpm
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        id: python
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Enable Windows long paths for IDE validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Package macOS validation build
        if: runner.os == 'macOS'
        run: bash scripts/build.sh --allow-unsigned-platform
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Package Windows validation build
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'echo-windows-build.log'
          & .\scripts\build.ps1 -AllowUnsignedPlatform *>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = Get-Content -LiteralPath $buildLog -Tail 120 | Out-String
            if ($tail.Length -gt 12000) { $tail = $tail.Substring($tail.Length - 12000) }
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows packaging failed::$message"
            exit $buildExit
          }
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Preserve Windows packaging diagnostics
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaging-diagnostics
          path: ${{ runner.temp }}/echo-windows-build.log
          if-no-files-found: ignore
      - run: pnpm test:security
      - run: node vendor/theia-platform/node_modules/playwright/cli.js install chromium
      - run: node scripts/validate-theia-runtime.mjs
      - run: pnpm test:rust
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          ECHO_VALIDATE_LONG_PATHS: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Start packaged macOS WebView, IDE and native IPC
        if: runner.os == 'macOS'
        env:
          ECHO_DESKTOP_VALIDATION_OUTPUT: ${{ runner.temp }}/echo-packaged-desktop-diagnostics
        run: |
          mount_point="$RUNNER_TEMP/echoagent-validation"
          mkdir -p "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          dmg="src-tauri/target/release/bundle/dmg/EchoAgent-v$(node scripts/release-version.mjs check)-${{ matrix.target }}.dmg"
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mount_point" "$dmg"
          node scripts/validate-packaged-desktop.mjs "$mount_point/EchoAgent.app/Contents/MacOS/echoagent"
      - name: Install and start Windows WebView; check native IPC
        if: runner.os == 'Windows'
        env:
          ECHO_DESKTOP_VALIDATION_OUTPUT: ${{ runner.temp }}/echo-packaged-desktop-diagnostics
        shell: pwsh
        run: |
          $version = node scripts/release-version.mjs check
          $installer = Get-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/EchoAgent-v$version-windows-x86_64-setup.exe"
          node scripts/inspect-windows-installer.mjs $installer.FullName $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer embedded version check failed' }
          $installDir = Join-Path $env:RUNNER_TEMP 'EchoAgent中文路径验证'
          $result = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          node scripts/validate-packaged-desktop.mjs "$installDir/echoagent.exe"
      - name: Preserve packaged desktop startup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/echo-packaged-desktop-diagnostics
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          if-no-files-found: error
