name: desktop-validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: &packaging-paths
      - '.github/workflows/desktop-validation.yml'
      - '.github/actions/**'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'index.html'
      - 'app-icon.png'
      - 'public/**'
      # Validate every installer input, including platform config, embedded
      # Runtime/IDE source and scripts included by the native validation code.
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths: *packaging-paths
permissions:
  contents: read
concurrency:
  group: desktop-validation-${{ github.ref }}
  # Main builds can take hours. Finish the active matrix while new pushes
  # replace only the pending run; PR iterations can still cancel older work.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  packaged-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: darwin-aarch64
          - os: macos-15-intel
            arch: x86_64
            target: darwin-x86_64
          # The locked native addons require VS 2022; windows-latest uses VS 2026.
          - os: windows-2022
            arch: x64
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    # Cold Intel packaging took 156 minutes in run 42218554799; the 180-minute
    # job then killed the complete Rust tests. Reserve time for those tests and
    # native installer checks even when the dependency caches are cold.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Verify native packaging architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ runner.os == 'Windows' && '24.22.1' || '22.23.4' }}
          cache: pnpm
      - name: Enable Windows long paths for IDE validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      # Fail on application regressions before installing the native packaging toolchain.
      - run: pnpm install --frozen-lockfile
      - name: Run frontend and script unit tests
        id: unit_tests
        run: pnpm test --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit="${{ runner.temp }}/echo-unit-tests.xml"
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install verified pinned protoc
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Keep compiled dependencies when a later installer/desktop check fails.
          cache-on-failure: 'true'
      - name: Package macOS validation build
        if: runner.os == 'macOS'
        run: |
          diagnostics="$RUNNER_TEMP/echo-macos-packaging-diagnostics"
          mkdir -p "$diagnostics"
          {
            sw_vers
            uname -m
            printf 'CI=%s\nTAURI_BUNDLER_DMG_IGNORE_CI=%s\n' "${CI:-}" "${TAURI_BUNDLER_DMG_IGNORE_CI:-}"
            df -h . "$RUNNER_TEMP"
            hdiutil info
          } > "$diagnostics/environment-before.log" 2>&1 || true
          set +e
          bash scripts/build.sh --allow-unsigned-platform 2>&1 | tee "$diagnostics/build.log"
          build_status=("${PIPESTATUS[@]}")
          set -e
          build_exit="${build_status[0]}"
          if [[ "$build_exit" -eq 0 && "${build_status[1]}" -ne 0 ]]; then
            build_exit="${build_status[1]}"
          fi
          {
            df -h . "$RUNNER_TEMP"
            du -sh src-tauri/target/release/bundle src-tauri/resources/theia
            hdiutil info
          } > "$diagnostics/environment-after.log" 2>&1 || true
          bundle_script="src-tauri/target/release/bundle/dmg/bundle_dmg.sh"
          if [[ -f "$bundle_script" ]]; then
            cp "$bundle_script" "$diagnostics/bundle_dmg.sh"
          fi
          if [[ "$build_exit" -ne 0 ]]; then
            node --input-type=module - "$diagnostics/build.log" "$build_exit" <<'JS'
          import { readFileSync } from 'node:fs';
          const tail = readFileSync(process.argv[2], 'utf8').replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, '').slice(-2800);
          const message = `Exit code ${process.argv[3]}\n${tail}`.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.error(`::error title=macOS packaging failed::${message}`);
          JS
          fi
          exit "$build_exit"
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Package Windows validation build
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'echo-windows-build.log'
          & .\scripts\build.ps1 -AllowUnsignedPlatform *>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = Get-Content -LiteralPath $buildLog -Tail 120 | Out-String
            $tail = [regex]::Replace($tail, '\x1B\[[0-?]*[ -/]*[@-~]', '')
            if ($tail.Length -gt 2800) { $tail = $tail.Substring($tail.Length - 2800) }
            $message = "Exit code $buildExit`n$tail".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows packaging failed::$message"
            exit $buildExit
          }
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PYTHON: ${{ steps.python.outputs.python-path }}
      - run: pnpm test:security
      - run: node vendor/theia-platform/node_modules/playwright/cli.js install chromium
      - run: node scripts/validate-theia-runtime.mjs
      - run: pnpm test:rust
        env:
          NATIVE_TEST_OUTPUT: ci-artifacts/native-tests
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          ECHO_VALIDATE_LONG_PATHS: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Verify bundled model inference and offline model package import
        run: pnpm test:retrieval-offline
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
      - name: Start packaged macOS WebView, IDE and native IPC
        if: runner.os == 'macOS'
        env:
          ECHO_DESKTOP_VALIDATION_OUTPUT: ${{ runner.temp }}/echo-packaged-desktop-diagnostics
        run: |
          mount_point="$RUNNER_TEMP/echoagent-validation"
          mkdir -p "$mount_point"
          dmg="src-tauri/target/release/bundle/dmg/EchoAgent-v$(node scripts/release-version.mjs check)-${{ matrix.target }}.dmg"
          trap 'node scripts/macos-dmg.mjs detach "$dmg" "$mount_point" || true' EXIT
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mount_point" "$dmg"
          node scripts/validate-packaged-desktop.mjs "$mount_point/EchoAgent.app/Contents/MacOS/echoagent"
      - name: Verify Windows install paths, repair, shortcuts and native IPC
        if: runner.os == 'Windows'
        env:
          ECHO_DESKTOP_VALIDATION_OUTPUT: ${{ runner.temp }}/echo-packaged-desktop-diagnostics
        shell: pwsh
        run: |
          $version = node scripts/release-version.mjs check
          $installer = Get-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/EchoAgent-v$version-windows-x86_64-setup.exe"
          node scripts/inspect-windows-installer.mjs $installer.FullName $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer embedded version check failed' }
          ./scripts/validate-windows-installer.ps1 -Installer $installer.FullName
      # Keep reporting after all application checks so upload outages cannot
      # prevent installer/runtime verification from being attempted.
      - name: Preserve unit test report
        if: ${{ always() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.target }}
          path: ${{ runner.temp }}/echo-unit-tests.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve macOS packaging diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-packaging-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/echo-macos-packaging-diagnostics
          if-no-files-found: ignore
      - name: Preserve Windows packaging diagnostics
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaging-diagnostics
          path: ${{ runner.temp }}/echo-windows-build.log
          if-no-files-found: ignore
      - name: Preserve complete native test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-${{ matrix.target }}
          path: ci-artifacts/native-tests
          if-no-files-found: ignore
      - name: Preserve packaged desktop startup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/echo-packaged-desktop-diagnostics
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-validation-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          if-no-files-found: error
