[package]
name = "echo-document-workspace-check"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]

# Also inherited by cargo test; retain backtrace locations without large caches.
[profile.dev]
debug = "line-tables-only"
incremental = false

[lib]
path = "harness.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
