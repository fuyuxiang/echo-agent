[package]
name = "echo-desktop-stability-check"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "harness.rs"
[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
process-wrap = { version = "9.0.0", features = ["std", "tokio1"] }
[build-dependencies]
tauri-build = "=2.6.3"
[dev-dependencies]
tempfile = "3"
[features]
native-fixture = ["tauri/custom-protocol"]
[[bin]]
name = "echo-stability-fixture"
path = "main.rs"
required-features = ["native-fixture"]
[profile.stability]
inherits = "dev"
debug = 0
debug-assertions = false
opt-level = 0
incremental = true
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "0.61.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[patch.crates-io]
glib = { path = "../../vendor/glib" }
