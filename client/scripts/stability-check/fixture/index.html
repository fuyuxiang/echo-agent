<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>EchoAgent 隔离恢复验收</title>
<body style="font:16px system-ui;padding:24px"><h1>界面恢复验收</h1><p id="status">仅使用独立临时目录，正在验证恢复…</p><input id="draft" aria-label="验收草稿" style="width:100%">
<script src="renderer-health.js"></script>
<script>
(async () => {
  const invoke = window.__TAURI_INTERNALS__.invoke;
  const config = await invoke("fixture_config");
  EchoRendererHealth.startRendererHealth();
  const draftKey = `${config.nonce}:draft`;
  const expected = "恢复后保留草稿：中文、空格与附件说明";
  const step = config.step;
  if (step === 0) localStorage.setItem(draftKey, expected);
  const draft = localStorage.getItem(draftKey);
  if (draft !== expected) throw new Error("草稿未能跨界面/宿主重建保留");
  document.getElementById("draft").value = draft;
  let status;
  const expectedPhase = step === 0 || config.steps[step - 1] === "restart" ? "ready" : "restored";
  for (let retry = 0; retry < 100; retry++) {
    await new Promise(resolve => setTimeout(resolve, 100));
    status = await invoke("desktop_recovery_status");
    if (status.phase === expectedPhase) break;
  }
  if (status.phase !== expectedPhase) throw new Error(`步骤 ${step}（${config.steps[step - 1] || "boot"}）界面状态不正确：预期 ${expectedPhase}，实际 ${JSON.stringify(status)}`);
  await invoke("fixture_report", { value: { step, draft, document: crypto.randomUUID(), status } });
  if (step >= config.steps.length) { await invoke("fixture_finish"); return; }
  document.getElementById("status").textContent = `正在验证 ${config.steps[step]}，草稿已保存`;
  await new Promise(resolve => setTimeout(resolve, 500));
  await invoke("fixture_fail", { nonce: config.nonce, kind: config.steps[step] });
})().catch(async error => {
  document.getElementById("status").textContent = String(error);
  await window.__TAURI_INTERNALS__.invoke("fixture_report", { value: { error: String(error) } });
});
</script></body></html>
