[package]
license = "Apache-2.0"
name = "echo-agent-fast-worktree"
version = "0.1.0"
edition.workspace = true
description = "High-performance git worktree creation using CoW cloning"

[[bin]]
name = "fast-worktree"
path = "src/bin/cli.rs"

[[bin]]
name = "pool-perf-bench"
path = "src/bin/pool_perf_bench.rs"
required-features = ["bench"]

[[bin]]
name = "nfs-create-latency-bench"
path = "src/bin/nfs_create_latency_bench.rs"
required-features = ["bench"]

[features]
default-bazel = ["metadata"]
bench = []
# SQLite metadata DB for worktree tracking.
metadata = ["dep:rusqlite", "dep:echo-agent-sqlite-journal"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
crossbeam = { workspace = true }
dashmap = { workspace = true }
dunce = { workspace = true }
echo-agent-home = { workspace = true }
gix = { workspace = true, features = ["status", "parallel"] }
gix-status = { version = "0.30.0" }
globset = { workspace = true }
ignore = { workspace = true }
libc = { workspace = true }
num_cpus = { workspace = true }

reflink-copy = { workspace = true }
rapidhash = "4.2.0"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
echo-agent-gix-status = { workspace = true }
echo-agent-sqlite-journal = { workspace = true, optional = true }
echo-agent-tty-utils = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
echo-agent-test-utils = { workspace = true }
# Unconditional because cargo doesn't support feature-gated dev-deps cleanly.
# Only used by tests behind #[cfg(feature = "metadata")] in db/tests.rs.
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.30", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
