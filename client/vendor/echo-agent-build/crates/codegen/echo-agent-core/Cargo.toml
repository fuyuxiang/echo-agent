[package]
license = "Apache-2.0"
name = "echo-agent-core"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
echo-agent-hooks = { path = "../echo-agent-hooks" }
echo-agent-sampling-types = { path = "../echo-agent-sampling-types" }
echo-agent-tools = { path = "../echo-agent-tools" }
echo-agent-tty-utils = { workspace = true }
echo-agent-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
dirs = "6"
echo-agent-config = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
echo-agent-tool-types.workspace = true

[features]
desktop = ["echo-agent-tools/desktop"]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
