[package]
license = "Apache-2.0"
name = "echo-agent-memory"
version = "0.1.0"
edition.workspace = true

[features]
local-inference = ["dep:ort", "dep:tokenizers"]
# Exposes `#[cfg(test)]`-only helpers (`MemoryStorage::with_paths`,
# `MockEmbeddingProvider`) to downstream crates' test targets.
test-support = []

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs"], optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
dunce = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
git2 = { version = "0.21", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
# sqlite-vec: vec0 virtual table for KNN vector search.
sqlite-vec = "=0.1.7-alpha.2"
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
echo-agent-auth = { workspace = true }
echo-agent-config-types = { workspace = true }
echo-agent-http = { workspace = true }
echo-agent-tools = { workspace = true }
echo-agent-version = { workspace = true }
echo-agent-sqlite-journal = { workspace = true }
echo-agent-token-estimation = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }

[lints]
workspace = true
