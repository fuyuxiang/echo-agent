<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Memory carries context. Evolution builds skills.</title>
  <desc id="description">Runtime memory: Working supplies current context; Episodic and Semantic retain summaries and facts. Scope and lifecycle eligibility filter mixed recall, which joins current context in ContextStage. Archived, superseded, and unresolved entries are excluded from normal recall. Evolution: trajectories and reflection produce candidates; validation, risk checks, and isolated A/B evaluation decide promotion, review, or rejection. Promoted changes support manual rollback.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#2563eb" />
    </marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#087f82" />
    </marker>
    <marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#526780" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <rect x="1" y="1" width="1198" height="848" rx="20" fill="#f7faff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="36" y="32" width="5" height="55" rx="2" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="56" y="57" fill="#142b49" font-size="30" font-weight="700" text-anchor="start">Memory carries context. Evolution builds skills.</text>
    <text x="56" y="87" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Both support future tasks. Skill evolution is opt-in; proposals do not go straight to the live library.</text>
    <rect x="36" y="128" width="548" height="620" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="60" y="172" fill="#2563eb" font-size="25" font-weight="700" text-anchor="start">01  Cognitive memory</text>
    <rect x="616" y="128" width="548" height="620" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="640" y="172" fill="#087f82" font-size="25" font-weight="700" text-anchor="start">02  Self-evolving skills</text>
    <rect x="76" y="206" width="468" height="72" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="77" y="220" width="3" height="44" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="96" y="236.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">Current task and session context</text>
    <text x="96" y="262.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Working</text>
    <rect x="76" y="318" width="468" height="86" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="77" y="332" width="3" height="58" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="96" y="355.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">Session summaries and durable facts</text>
    <text x="96" y="381.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Episodic / Semantic</text>
    <rect x="76" y="454" width="468" height="96" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="77" y="468" width="3" height="68" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="96" y="496.0" fill="#142b49" font-size="20" font-weight="650" text-anchor="start">Scope, eligibility, and hybrid recall</text>
    <text x="96" y="522.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">BM25 + optional Vector / RRF</text>
    <path d="M310 404 L310 454" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="76" y="604" width="468" height="72" rx="12" fill="#edf4ff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="77" y="618" width="3" height="44" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="96" y="634.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">ContextStage</text>
    <text x="96" y="660.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Current context + snapshots + recalled memory</text>
    <path d="M310 550 L310 604" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <path d="M76 242 L56 242 L56 640 L76 640" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <text x="76" y="714" fill="#526780" font-size="17" font-weight="400" text-anchor="start">Archived / superseded / unresolved → excluded</text>
    <rect x="640" y="206" width="500" height="72" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="641" y="220" width="3" height="44" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="660" y="236.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">Execution trajectories and reflection</text>
    <text x="660" y="262.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Recorder / TrajectoryStore</text>
    <rect x="640" y="318" width="500" height="86" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="641" y="332" width="3" height="58" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="660" y="355.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">Propose skill candidates</text>
    <text x="660" y="381.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Evolver → SkillCandidate</text>
    <path d="M890 278 L890 318" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" />
    <rect x="640" y="454" width="500" height="96" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="641" y="468" width="3" height="68" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="660" y="496.0" fill="#142b49" font-size="20" font-weight="650" text-anchor="start">Validate / risk-check / isolated A/B eval</text>
    <text x="660" y="522.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Validation + PromotionGate</text>
    <path d="M890 404 L890 454" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" />
    <rect x="640" y="604" width="236" height="72" rx="12" fill="#edf9f7" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="641" y="618" width="3" height="44" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="660" y="634.0" fill="#142b49" font-size="19" font-weight="650" text-anchor="start">Pass → promote</text>
    <text x="660" y="660.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">When policy permits</text>
    <rect x="902" y="604" width="238" height="72" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="903" y="618" width="3" height="44" rx="1" fill="#526780" stroke="none" stroke-width="1.2" />
    <text x="922" y="634.0" fill="#142b49" font-size="19" font-weight="650" text-anchor="start">Review / reject</text>
    <text x="922" y="660.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Risk / policy / eval</text>
    <path d="M890 550 L890 578 L758 578 L758 604" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" />
    <path d="M890 578 L1020 578 L1020 604" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" />
    <text x="640" y="714" fill="#526780" font-size="17" font-weight="400" text-anchor="start">Promoted skills serve future tasks; rollback is manual.</text>
    <text x="600" y="797" fill="#526780" font-size="18" font-weight="400" text-anchor="middle">Background consolidation and evolution follow configuration; evolution updates skills, not model weights.</text>
  </g>
</svg>
