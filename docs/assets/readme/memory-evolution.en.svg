<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">Runtime memory and skill-evolution flow</title>
  <desc id="description">Left: filter eligible memory, retrieve, and assemble context. Right: opt-in evolution proposes candidates, validates and evaluates them, then promotes, holds for review, or rejects.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#2563eb" />
    </marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#087f82" />
    </marker>
    <marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#526780" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <rect x="1" y="1" width="1198" height="998" rx="20" fill="#f7faff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="36" y="32" width="5" height="55" rx="2" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="56" y="57" fill="#142b49" font-size="30" font-weight="700" text-anchor="start">Runtime memory and skill-evolution flow</text>
    <text x="56" y="87" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Separate processes: memory supplies facts; evolution proposes reusable skills.</text>
    <rect x="36" y="120" width="548" height="800" rx="4" fill="none" stroke="#526780" stroke-width="1.2" stroke-dasharray="7 5" />
    <rect x="47.39" y="131" width="142.02" height="25" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="118.4" y="149" fill="#526780" font-size="18" font-weight="400" text-anchor="middle">Memory recall</text>
    <rect x="616" y="120" width="548" height="800" rx="4" fill="none" stroke="#526780" stroke-width="1.2" stroke-dasharray="7 5" />
    <rect x="627.96" y="131" width="323.28" height="25" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="789.6" y="149" fill="#526780" font-size="18" font-weight="400" text-anchor="middle">Skill evolution (off by default)</text>
    <rect x="170" y="180" width="280" height="48" rx="24" fill="#edf4ff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="310" y="211" fill="#142b49" font-size="19" font-weight="600" text-anchor="middle">Task needs context</text>
    <rect x="86" y="290" width="448" height="64" rx="0" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="310" y="330" fill="#142b49" font-size="20" font-weight="650" text-anchor="middle">Filter scope and eligibility</text>
    <rect x="86" y="440" width="448" height="64" rx="0" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="310" y="480" fill="#142b49" font-size="20" font-weight="650" text-anchor="middle">Keyword and optional vector recall</text>
    <rect x="86" y="590" width="448" height="64" rx="0" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="310" y="630" fill="#142b49" font-size="20" font-weight="650" text-anchor="middle">Fuse ranks; optionally rerank</text>
    <rect x="86" y="740" width="448" height="64" rx="0" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="310" y="780" fill="#142b49" font-size="20" font-weight="650" text-anchor="middle">Combine history, knowledge, memory</text>
    <path d="M310 228 L310 290" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <path d="M310 354 L310 440" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <path d="M310 504 L310 590" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <path d="M310 654 L310 740" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <path d="M310 804 L310 850" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="170" y="850" width="280" height="48" rx="24" fill="#edf4ff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="310" y="881" fill="#142b49" font-size="19" font-weight="600" text-anchor="middle">Supply turn context</text>
    <rect x="750" y="180" width="280" height="48" rx="24" fill="#edf4ff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="890" y="211" fill="#142b49" font-size="19" font-weight="600" text-anchor="middle">Evolution enabled</text>
    <rect x="666" y="280" width="448" height="64" rx="0" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="890" y="320" fill="#142b49" font-size="20" font-weight="650" text-anchor="middle">Propose from traces and reflection</text>
    <path d="M890 228 L890 280" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="666" y="385" width="448" height="64" rx="0" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="890" y="425" fill="#142b49" font-size="20" font-weight="650" text-anchor="middle">Validate, risk-check, evaluate</text>
    <path d="M890 344 L890 385" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <polygon points="890,490 1070,550 890,610 710,550" fill="#fff" stroke="#c8d8e9" stroke-width="1.5" />
    <text x="890" y="556" fill="#142b49" font-size="19" font-weight="600" text-anchor="middle">Admission outcome?</text>
    <path d="M890 449 L890 490" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="640" y="720" width="156" height="64" rx="4" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="718" y="759" fill="#142b49" font-size="20" font-weight="600" text-anchor="middle">Promote</text>
    <rect x="812" y="720" width="156" height="64" rx="4" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="890" y="759" fill="#142b49" font-size="20" font-weight="600" text-anchor="middle">Review</text>
    <rect x="984" y="720" width="156" height="64" rx="4" fill="#fff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="1062" y="759" fill="#142b49" font-size="20" font-weight="600" text-anchor="middle">Reject</text>
    <path d="M710 550 L650 550 L650 680 L718 680 L718 720" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="687.8" y="656" width="60.4" height="23" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="718" y="672" fill="#526780" font-size="16" font-weight="400" text-anchor="middle">Admit</text>
    <path d="M890 610 L890 720" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="864.04" y="655" width="51.92" height="23" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="890" y="671" fill="#526780" font-size="16" font-weight="400" text-anchor="middle">Hold</text>
    <path d="M1070 550 L1130 550 L1130 680 L1062 680 L1062 720" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="1036.04" y="656" width="51.92" height="23" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="1062" y="672" fill="#526780" font-size="16" font-weight="400" text-anchor="middle">Fail</text>
    <rect x="750" y="850" width="280" height="48" rx="24" fill="#edf4ff" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="890" y="881" fill="#142b49" font-size="19" font-weight="600" text-anchor="middle">Record result and reason</text>
    <path d="M718 784 L718 818 L890 818 L890 850" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" />
    <path d="M890 784 L890 818 L890 818 L890 850" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" />
    <path d="M1062 784 L1062 818 L890 818 L890 850" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" />
    <text x="600" y="963" fill="#526780" font-size="16" font-weight="400" text-anchor="middle">Legend: rounded terminals, processing rectangles, decision diamonds, control-flow arrows. Rollback is manual.</text>
  </g>
</svg>
