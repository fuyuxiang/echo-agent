<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title description">
  <title id="title">Runtime component view</title>
  <desc id="description">Terminal and messaging inputs use channels; browser and API clients use Gateway. Events enter the bus and execution loop, which depends on context, model/tool, and memory/skill components and persists state.</desc>
