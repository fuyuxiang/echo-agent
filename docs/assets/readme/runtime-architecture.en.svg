<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title description">
  <title id="title">Runtime: from input to execution</title>
  <desc id="description">Channels and the local terminal connect via ChannelManager to MessageBus. Dashboard, CLI/TUI, and apps connect through HTTP/WebSocket to optional Gateway and then MessageBus. AgentLoop consumes inbound and publishes outbound events. Its pipeline uses ContextStage, InferenceStage, and ResponseStage, with sessions, memory, knowledge, models, tools, and approval dependencies. SQLite/files persist state; evolution consumes execution trajectories when enabled.</desc>
