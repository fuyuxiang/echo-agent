<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title">
  <title id="title">Echo Agent</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="260" rx="24"/></clipPath>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1328"/>
      <stop offset=".49" stop-color="#101c35"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <radialGradient id="blue-light" gradientUnits="userSpaceOnUse" gradientTransform="translate(342 142) rotate(-19) scale(501 192)" cx="0" cy="0" r="1">
      <stop stop-color="#294f9a" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#1c3d72" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1c3d72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-light" gradientUnits="userSpaceOnUse" gradientTransform="translate(444 20) rotate(-18) scale(407 186)" cx="0" cy="0" r="1">
      <stop stop-color="#166567" stop-opacity=".52"/>
      <stop offset="1" stop-color="#166567" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ripples" x1="65" y1="240" x2="732" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#577de2" stop-opacity="0"/>
      <stop offset=".28" stop-color="#70a0ff" stop-opacity=".25"/>
      <stop offset=".56" stop-color="#66c7fa" stop-opacity=".36"/>
      <stop offset="1" stop-color="#66e8d3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="9" y1="6" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4fffc"/>
      <stop offset=".4" stop-color="#91d6ff"/>
      <stop offset="1" stop-color="#6d9dff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="1" y1="24" x2="30" y2="11" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b9eff"/>
      <stop offset=".55" stop-color="#64caf4"/>
      <stop offset="1" stop-color="#83ffe0"/>
    </linearGradient>
    <mask id="orbit-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="white"/>
      <path d="M2.3 21.3C3.4 24.1 17.8 20.2 25 15.8" fill="none" stroke="black" stroke-width="2.8"/>
      <circle cx="24.7" cy="15.7" r="3.4"/>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#background)"/>
    <rect width="1200" height="260" fill="url(#blue-light)"/>
    <rect width="1200" height="260" fill="url(#teal-light)"/>
    <g fill="none" stroke="url(#ripples)">
      <ellipse cx="354" cy="130" rx="150" ry="67" transform="rotate(-22 354 130)"/>
      <ellipse cx="354" cy="130" rx="219" ry="99" transform="rotate(-22 354 130)" opacity=".78"/>
      <ellipse cx="354" cy="130" rx="311" ry="144" transform="rotate(-22 354 130)" opacity=".58"/>
      <ellipse cx="354" cy="130" rx="427" ry="200" transform="rotate(-22 354 130)" opacity=".36"/>
    </g>

    <!-- Swept E and orbit from the desktop tray mark. -->
    <g transform="translate(263 47) scale(5.2)">
      <ellipse cx="16" cy="17" rx="14.3" ry="3.7" transform="rotate(-18 16 17)" fill="none" stroke="url(#orbit)" stroke-width="1.15" opacity=".58"/>
      <g mask="url(#orbit-clearance)" fill="url(#mark)">
        <path d="M26.7 6.2H14.4C9.2 6.2 6.5 9.9 6.5 15c0 1 .1 1.9.3 2.7.5-3.8 3.4-5.2 7.1-5.6l7.1-.8c3.4-.4 5-2.5 5.7-5.1Z"/>
        <path d="M21.4 14.1h-8c-4.6 0-6.9 2.4-6.9 6.2 0 4.1 3 6 7.4 6h13.4c-.9-3.6-3.5-5.4-7.5-5.4h-7.2c-1.6 0-2.9-.3-3.6-1 1.1-.8 2.6-1.2 4.3-1.3l3.5-.2c2.5-.1 4-1.7 4.6-4.3Z"/>
      </g>
      <path d="M2.3 21.3C3.4 24.1 17.8 20.2 25 15.8" fill="none" stroke="url(#orbit)" stroke-width="1.15" stroke-linecap="round"/>
      <circle cx="24.7" cy="15.7" r="2.5" fill="#83ffe0"/>
    </g>

    <text x="464" y="159" fill="#f3f7ff" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="91" font-weight="700" letter-spacing="-4">Echo Agent</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="259" rx="23.5" fill="none" stroke="#8bade7" stroke-opacity=".22"/>
</svg>
