    <rect x="646" y="725" width="488" height="106" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="647" y="739" width="3" height="78" rx="1" fill="#526780" stroke="none" stroke-width="1.2" />
    <text x="666" y="759.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">工具与业务服务</text>
    <text x="666" y="785.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">[External Software System]</text>
    <text x="666" y="811.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">MCP / external APIs</text>
    <path d="M190 491 L190 725" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="132.346" y="649" width="115.30800000000002" height="24" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="190" y="666" fill="#526780" font-size="17" font-weight="400" text-anchor="middle">请求模型处理</text>
    <path d="M770 491 L770 635 L430 635 L430 725" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="432.346" y="616" width="115.30800000000002" height="24" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="490" y="633" fill="#526780" font-size="17" font-weight="400" text-anchor="middle">请求模型处理</text>
    <path d="M66 450 L20 450 L20 880 L890 880 L890 831" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" />
    <rect x="498.197" y="885" width="203.60600000000005" height="24" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="600" y="902" fill="#526780" font-size="17" font-weight="400" text-anchor="middle">Desktop 调用已配置工具</text>
    <path d="M1010 491 L1148 491 L1148 693 L1010 693 L1010 725" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" />
    <rect x="944.237" y="675" width="131.526" height="24" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="1010" y="692" fill="#526780" font-size="17" font-weight="400" text-anchor="middle">调用已配置工具</text>
    <text x="600" y="978" fill="#526780" font-size="17" font-weight="400" text-anchor="middle">图例：方框内标注类型与职责；有向实线表示调用关系；虚线框表示使用或部署范围。</text>
    <text x="600" y="1015" fill="#526780" font-size="17" font-weight="400" text-anchor="middle">箭头表示请求方向，响应沿原交互返回；两端配置和状态不自动同步。</text>
