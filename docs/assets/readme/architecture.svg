    <rect x="616" y="300" width="548" height="310" rx="4" fill="none" stroke="#526780" stroke-width="1.2" stroke-dasharray="7 5" />
    <rect x="627.432" y="311" width="155.37600000000003" height="25" rx="2" fill="#f7faff" stroke="none" stroke-width="1.2" />
    <text x="705.12" y="329" fill="#526780" font-size="18" font-weight="400" text-anchor="middle">终端或自托管部署</text>
    <rect x="66" y="375" width="488" height="116" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="67" y="389" width="3" height="88" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
