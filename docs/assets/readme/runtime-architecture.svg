<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title description">
  <title id="title">Runtime：从入口到执行</title>
  <desc id="description">消息通道和本地终端通过 ChannelManager 连接 MessageBus；Dashboard、CLI/TUI 和应用通过 HTTP/WebSocket 连接可选 Gateway，再进入 MessageBus。AgentLoop 消费入站事件并发布出站事件。循环使用 ContextStage、InferenceStage 与 ResponseStage，依赖会话、记忆、知识、模型、工具和审批模块。SQLite 与文件保存状态；执行轨迹在启用进化后进入 EvolutionEngine。</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#2563eb" />
    </marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#087f82" />
    </marker>
    <marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#526780" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <rect x="1" y="1" width="1198" height="868" rx="20" fill="#f7faff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="36" y="32" width="5" height="55" rx="2" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="56" y="57" fill="#142b49" font-size="30" font-weight="700" text-anchor="start">Runtime：从入口到执行</text>
    <text x="56" y="87" fill="#526780" font-size="18" font-weight="400" text-anchor="start">app.py 装配生命周期；Gateway 为可选服务入口，AgentLoop 负责执行任务。</text>
    <rect x="36" y="128" width="500" height="76" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="37" y="142" width="3" height="48" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="56" y="160.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">终端 / 消息通道</text>
    <text x="56" y="186.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">本地 CLI 通道 · IM · Webhook</text>
    <rect x="664" y="128" width="500" height="76" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="665" y="142" width="3" height="48" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="684" y="160.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">Dashboard / CLI·TUI / 你的应用</text>
    <text x="684" y="186.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">HTTP / WebSocket</text>
    <rect x="36" y="248" width="500" height="76" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="37" y="262" width="3" height="48" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="56" y="280.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">ChannelManager</text>
    <text x="56" y="306.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">echo_agent/channels/</text>
    <rect x="664" y="248" width="500" height="76" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="665" y="262" width="3" height="48" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="684" y="280.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">GatewayServer</text>
    <text x="684" y="306.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">可选 · aiohttp · 认证与管理 API</text>
    <path d="M286 204 L286 248" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)" />
    <path d="M914 204 L914 248" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" />
