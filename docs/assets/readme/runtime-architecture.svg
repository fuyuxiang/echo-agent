    <text x="440" y="704.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Router / Tools / MCP / Approval</text>
    <path d="M600 584 L600 616 L600 616 L600 642" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" stroke-dasharray="6 5" />
    <rect x="804" y="642" width="360" height="84" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="805" y="656" width="3" height="56" rx="1" fill="#087f82" stroke="none" stroke-width="1.2" />
    <text x="824" y="678.0" fill="#142b49" font-size="20" font-weight="650" text-anchor="start">Skills 与进化</text>
    <text x="824" y="704.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Skills / Plugins / Evolution</text>
    <path d="M600 584 L600 616 L984 616 L984 642" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" stroke-dasharray="6 5" />
    <rect x="36" y="770" width="1128" height="58" rx="12" fill="#edf3f9" stroke="#c8d8e9" stroke-width="1.2" />
    <text x="600" y="806" fill="#526780" font-size="18" font-weight="400" text-anchor="middle">持久化：SQLite + 工作区文件；自动化、工具集与进化均按配置启用。</text>
  </g>
</svg>
