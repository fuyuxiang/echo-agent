    <text x="260" y="533.0" fill="#142b49" font-size="21" font-weight="650" text-anchor="start">AgentLoop</text>
    <text x="260" y="559.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">ContextStage → InferenceStage → ResponseStage</text>
    <path d="M600 448 L600 494" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)" />
    <rect x="36" y="642" width="360" height="84" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="37" y="656" width="3" height="56" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
    <text x="56" y="678.0" fill="#142b49" font-size="20" font-weight="650" text-anchor="start">上下文与状态</text>
    <text x="56" y="704.0" fill="#526780" font-size="18" font-weight="400" text-anchor="start">Sessions / Memory / Knowledge</text>
    <path d="M600 584 L600 616 L216 616 L216 642" fill="none" stroke="#526780" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" stroke-dasharray="6 5" />
    <rect x="420" y="642" width="360" height="84" rx="12" fill="#ffffff" stroke="#c8d8e9" stroke-width="1.2" />
    <rect x="421" y="656" width="3" height="56" rx="1" fill="#2563eb" stroke="none" stroke-width="1.2" />
