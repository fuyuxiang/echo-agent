<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title description">
  <title id="title">Runtime 组件视图</title>
  <desc id="description">终端与消息平台通过通道接入，网页与 API 客户端通过 Gateway 接入，入站事件进入事件总线和执行循环。循环依赖上下文、模型工具及记忆技能组件，状态写入持久化存储。</desc>
