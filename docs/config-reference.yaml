# Echo Agent 配置参考(自动生成,请勿手改)

# ── security ──
security:
  # 整体安全档位预设 (默认: personal_cli) [personal_cli|daemon|public_gateway]
  profile: personal_cli

# ── channels ──
channels:
  telegram:
    # 是否启用 Telegram 通道 (默认: false)
    enabled: false
    # Telegram Bot API token (默认: "")
    token: ""
    # 允许与机器人交互的用户白名单(空为不限制) (默认: [])
    allowFrom: []
    # 访问 Telegram API 的代理地址 (默认: null)
    proxy: null
    # 群聊响应策略:open 全部响应,mention 仅被@时响应 (默认: mention) [open|mention]
    groupPolicy: mention
    # 是否对消息添加表情回应 (默认: true)
    reactionsEnabled: true
  discord:
    # 是否启用 Discord 通道 (默认: false)
    enabled: false
    # Discord Bot token (默认: "")
    token: ""
    # 允许与机器人交互的用户白名单(空为不限制) (默认: [])
    allowFrom: []
    # 群聊响应策略:open 全部响应,mention 仅被@时响应 (默认: mention) [open|mention]
    groupPolicy: mention
    # 是否对消息添加表情回应 (默认: true)
    reactionsEnabled: true
  webhook:
    # 是否启用 Webhook 通道 (默认: false)
    enabled: false
    # Webhook 服务监听地址 (默认: 0.0.0.0)
    host: 0.0.0.0
    # Webhook 服务监听端口 (默认: 8080)
    port: 8080
    # 校验入站请求签名的密钥 (默认: "")
    secret: ""
    # Webhook 接收路径 (默认: /webhook)
    path: /webhook
    # 待处理 webhook 请求队列上限 (默认: 1000)
    maxPending: 1000
  cli:
    # 是否启用命令行通道 (默认: true)
    enabled: true
  cron:
    # 是否启用定时任务通道 (默认: false)
    enabled: false
  slack:
    # 是否启用 Slack 通道 (默认: false)
    enabled: false
    # Slack bot token(xoxb-) (默认: "")
    botToken: ""
    # Slack app-level token(xapp-),用于 Socket 模式 (默认: "")
    appToken: ""
    # 允许与机器人交互的用户白名单(空为不限制) (默认: [])
    allowFrom: []
    # 是否对消息添加表情回应 (默认: true)
    reactionsEnabled: true
  whatsapp:
    # 是否启用 WhatsApp 通道 (默认: false)
    enabled: false
    # WhatsApp webhook 验证 token (默认: "")
    verifyToken: ""
    # WhatsApp Cloud API 访问令牌 (默认: "")
    accessToken: ""
    # WhatsApp 发送号码 ID (默认: "")
    phoneNumberId: ""
    # WhatsApp webhook 接收路径 (默认: /whatsapp)
    webhookPath: /whatsapp
    # WhatsApp 服务监听地址 (默认: 0.0.0.0)
    host: 0.0.0.0
    # WhatsApp 服务监听端口 (默认: 8081)
    port: 8081
  weixin:
    # 是否启用微信(个人客服)通道 (默认: false)
    enabled: false
    # 微信客服账号 ID (默认: "")
    accountId: ""
    # 微信接入鉴权 token (默认: "")
    token: ""
    # 微信 API 基础地址 (默认: https://ilinkai.weixin.qq.com)
    baseUrl: https://ilinkai.weixin.qq.com
    # 微信媒体 CDN 基础地址 (默认: https://novac2c.cdn.weixin.qq.com/c2c)
    cdnBaseUrl: https://novac2c.cdn.weixin.qq.com/c2c
    # 允许与机器人交互的用户白名单(空为不限制) (默认: [])
    allowFrom: []
    # 私聊响应策略 (默认: open)
    dmPolicy: open
    # 微信通道本地数据目录 (默认: "")
    dataDir: ""
  qqbot:
    # 是否启用 QQ 机器人通道 (默认: false)
    enabled: false
    # QQ 机器人 AppID (默认: "")
    appId: ""
    # QQ 机器人 AppSecret (默认: "")
    appSecret: ""
    # 允许与机器人交互的用户白名单(空为不限制) (默认: [])
    allowFrom: []
    # 是否使用 QQ 沙箱环境 (默认: false)
    sandbox: false
    # 是否启用 Markdown 消息支持 (默认: false)
    markdownSupport: false
    # 是否启用媒体(图片/文件)收发 (默认: true)
    mediaEnabled: true
    # 媒体上传单文件大小上限(MB) (默认: 20)
    mediaMaxFileSizeMb: 20
    # 媒体上传结果缓存条目上限 (默认: 500)
    mediaUploadCacheSize: 500
    # 是否解析消息中的媒体标签 (默认: true)
    mediaParseTags: true
  feishu:
    # 是否启用飞书通道 (默认: false)
    enabled: false
    # 飞书应用 App ID (默认: "")
    appId: ""
    # 飞书应用 App Secret (默认: "")
    appSecret: ""
    # 飞书事件回调验证 token (默认: "")
    verificationToken: ""
    # 飞书事件加密密钥 (默认: "")
    encryptionKey: ""
    # 飞书事件接收路径 (默认: /feishu)
    webhookPath: /feishu
    # 飞书服务监听地址 (默认: 0.0.0.0)
    host: 0.0.0.0
    # 飞书服务监听端口 (默认: 8083)
    port: 8083
  dingtalk:
    # 是否启用钉钉通道 (默认: false)
    enabled: false
    # 钉钉应用 AppKey (默认: "")
    appKey: ""
    # 钉钉应用 AppSecret (默认: "")
    appSecret: ""
    # 钉钉机器人编码 (默认: "")
    robotCode: ""
    # 允许与机器人交互的用户白名单(空为不限制) (默认: [])
    allowFrom: []
  email:
    # 是否启用邮件通道 (默认: false)
    enabled: false
    # 收信 IMAP 服务器地址 (默认: "")
    imapHost: ""
    # 收信 IMAP 服务器端口 (默认: 993)
    imapPort: 993
    # 发信 SMTP 服务器地址 (默认: "")
    smtpHost: ""
    # 发信 SMTP 服务器端口 (默认: 465)
    smtpPort: 465
    # 邮箱登录用户名 (默认: "")
    username: ""
    # 邮箱登录密码或授权码 (默认: "")
    password: ""
    # 是否使用 SSL 连接邮件服务器 (默认: true)
    useSsl: true
    # 轮询新邮件的间隔(秒) (默认: 30)
    pollIntervalSeconds: 30
    # 允许交互的发件人邮箱白名单(空为不限制) (默认: [])
    allowFrom: []
  wecom:
    # 是否启用企业微信通道 (默认: false)
    enabled: false
    # 企业微信企业 ID (默认: "")
    corpId: ""
    # 企业微信应用 AgentId (默认: "")
    agentId: ""
    # 企业微信应用 Secret (默认: "")
    secret: ""
    # 企业微信回调校验 token (默认: "")
    token: ""
    # 企业微信加密回调的 EncodingAESKey,留空则为明文模式 (默认: "")
    encodingAesKey: ""
    # 企业微信事件接收路径 (默认: /wecom)
    webhookPath: /wecom
    # 企业微信服务监听地址 (默认: 0.0.0.0)
    host: 0.0.0.0
    # 企业微信服务监听端口 (默认: 8084)
    port: 8084
  matrix:
    # 是否启用 Matrix 通道 (默认: false)
    enabled: false
    # Matrix homeserver 地址 (默认: "")
    homeserver: ""
    # Matrix 机器人用户 ID (默认: "")
    userId: ""
    # Matrix 访问令牌 (默认: "")
    accessToken: ""
    # 允许响应的房间白名单(空为不限制) (默认: [])
    allowRooms: []
    # 是否对消息添加表情回应 (默认: true)
    reactionsEnabled: true
  # 是否向用户推送处理进度提示 (默认: true)
  sendProgress: true
  # 是否推送工具调用提示 (默认: true)
  sendToolHints: true
  # 启用流式增量回复的通道列表 (默认: ['cli', 'telegram', 'discord', 'slack', 'gateway:*'])
  streamChannels: ['cli', 'telegram', 'discord', 'slack', 'gateway:*']
  # 流式回复累计多少字符后推送一段 (默认: 180)
  streamFlushChars: 180
  # 流式回复推送的最大时间间隔(毫秒) (默认: 1500)
  streamFlushIntervalMs: 1500
  # 是否按段落边界切分流式推送 (默认: true)
  streamParagraphMode: true
  # 语音转写服务的 API key (默认: "")
  transcriptionApiKey: ""

# ── models ──
models:
  # 无匹配路由时使用的默认模型 (默认: "")
  defaultModel: ""
  # 模型提供商配置列表 (默认: [])
  providers: []
  # 任务到模型的路由规则列表 (默认: [])
  routes: []
  # 全局兜底模型 (默认: "")
  fallbackModel: ""

# ── tools ──
tools:
  # 工具集预设档位 (默认: full) [minimal|messaging|coding|full]
  profile: full
  # 覆盖档位、显式允许的工具列表 (默认: [])
  allow: []
  # 在档位基础上额外允许的工具 (默认: [])
  alsoAllow: []
  # 显式禁用的工具列表 (默认: [])
  deny: []
  exec:
    # 是否启用 shell/进程执行工具 (默认: true)
    enabled: true
    # 命令输出截断的最大字符数 (默认: 16000)
    maxOutputChars: 16000
    # 命令执行所在的宿主环境 (默认: sandbox) [auto|local|sandbox|container|remote]
    host: sandbox
    # 命令执行安全模式 (默认: allowlist) [deny|allowlist|full]
    security: allowlist
    # 命令执行前的审批询问策略 (默认: on_miss) [off|on_miss|always]
    ask: on_miss
    # allowlist 模式下免审批直接放行的安全命令 (默认: ['awk', 'cat', 'date', 'echo', 'find', 'grep', 'head', 'ls', 'pwd', 'rg', 'sed', 'sort', 'tail', 'tr', 'uniq', 'wc'])
    safeBins: ['awk', 'cat', 'date', 'echo', 'find', 'grep', 'head', 'ls', 'pwd', 'rg', 'sed', 'sort', 'tail', 'tr', 'uniq', 'wc']
    # 额外允许执行的命令白名单 (默认: [])
    allowedCommands: []
    # 禁止执行的命令黑名单 (默认: [])
    blockedCommands: []
  web:
    # 是否启用网络访问工具 (默认: false)
    enabled: false
    # 网络访问使用的代理地址 (默认: null)
    proxy: null
    # 网络请求超时(秒) (默认: 30)
    timeoutSeconds: 30
    # 搜索服务 API key (默认: "")
    searchApiKey: ""
    # 网络搜索服务提供商 (默认: brave) [brave|tavily|serpapi|searxng]
    searchProvider: brave
    # 搜索服务 API 基础地址 (默认: "")
    searchApiBase: ""
    # 是否允许 web_fetch 访问私有/回环地址(SSRF 风险) (默认: false)
    allowPrivateAddresses: false
  # 是否将文件操作限制在工作区内 (默认: false)
  restrictToWorkspace: false
  # 允许写入的根目录 (默认: "")
  safeWriteRoot: ""
  # 是否自动下载、解密并解析入站文档附件(docx/xlsx/pptx/pdf) (默认: true)
  inboundDocumentEnabled: true
  # 入站文档自动注入正文的字符上限,超出则注入摘要并提示用 read_document 读全文 (默认: 8000)
  inboundDocumentMaxChars: 8000
  # MCP 服务配置(键为服务名) (默认: {})
  mcpServers: {}
  # MCP 工具安全策略:warn 仅告警,block 拦截 (默认: block) [warn|block]
  mcpSecurityPolicy: block
  imageGen:
    # 图像生成后端 (默认: openai)
    backend: openai
    # OpenAI 兼容后端 API key (默认: "")
    apiKey: ""
    # OpenAI 兼容后端 API 基础地址 (默认: "")
    apiBase: ""
    # 图像生成模型名 (默认: "")
    model: ""
    # FAL.ai 后端访问密钥 (默认: "")
    falKey: ""
    # FAL.ai 图像生成模型名 (默认: "")
    falModel: ""
  tts:
    # OpenAI TTS API key (默认: "")
    openaiApiKey: ""
    # OpenAI TTS API 基础地址 (默认: "")
    openaiApiBase: ""
    # TTS 模型名 (默认: "")
    model: ""
    # 默认语音合成后端 (默认: edge)
    defaultBackend: edge
    # 默认语音音色 (默认: "")
    defaultVoice: ""
  codeExec:
    # 是否启用代码执行工具 (默认: true)
    enabled: true
    # 代码执行超时(秒) (默认: 30)
    timeoutSeconds: 30
    # 允许执行的代码语言列表 (默认: ['python', 'javascript', 'bash'])
    allowedLanguages: ['python', 'javascript', 'bash']

# ── execution ──
execution:
  # 默认命令执行器类型 (默认: sandbox) [local|sandbox|container|remote]
  defaultExecutor: sandbox
  # sandbox 执行器的根目录 (默认: /tmp/echo-agent-sandbox)
  sandboxRoot: /tmp/echo-agent-sandbox
  # container 执行器使用的镜像 (默认: "")
  containerImage: ""
  # remote 执行器的目标主机 (默认: "")
  remoteHost: ""
  # remote 执行器登录用户名 (默认: root)
  remoteUser: root
  # remote 执行器 SSH 私钥路径 (默认: "")
  remoteKeyPath: ""
  # SSH 主机密钥严格校验策略 (默认: accept-new) [no|accept-new|yes]
  remoteStrictHostKey: accept-new
  # remote 执行器连接超时(秒) (默认: 10)
  remoteConnectTimeout: 10
  # 执行环境的网络访问策略 (默认: deny) [allow|deny|restricted]
  networkPolicy: deny

# ── permissions ──
permissions:
  # 全局管理员用户列表 (默认: [])
  adminUsers: []
  approval:
    # 执行前必须审批的工具/动作列表 (默认: ['cronjob', 'dep_install', 'exec', 'execute_code', 'process', 'skill_install', 'skill_manage'])
    requireApproval: ['cronjob', 'dep_install', 'exec', 'execute_code', 'process', 'skill_install', 'skill_manage']
    # 自动批准的工具/动作列表 (默认: [])
    autoApprove: []
    # 自动拒绝的工具/动作列表 (默认: [])
    autoDeny: []
    # 未命中规则时的默认审批策略 (默认: approve) [approve|deny|ask]
    defaultPolicy: approve
    # 等待人工审批的超时(秒) (默认: 300)
    waitTimeoutSeconds: 300
    # CLI 通道是否自动批准 (默认: true)
    cliAutoApprove: true
    # 免审批的可信通道列表 (默认: [])
    trustedChannels: []
    # 审批模式:manual 全人工,smart 智能判定,off 关闭 (默认: smart) [manual|smart|off]
    mode: smart
    # smart 模式判定审批所用模型 (默认: "")
    smartModel: ""
    # 无人值守时的审批策略 (默认: deny) [deny|allow_safe]
    unattendedPolicy: deny
  elevated:
    # 是否启用提权操作机制 (默认: false)
    enabled: false
    # 各通道允许提权的用户映射 (默认: {})
    allowFrom: {}

# ── credentials ──
credentials:
  # 存放凭据加密密钥的环境变量名 (默认: ECHO_AGENT_CREDENTIAL_KEY)
  encryptionKeyEnv: ECHO_AGENT_CREDENTIAL_KEY
  # 是否强制要求凭据加密 (默认: true)
  requireEncryption: true

# ── session ──
session:
  # 单会话保留的最大历史消息数 (默认: 500)
  maxHistoryMessages: 500
  # 会话过期时间(小时) (默认: 72)
  expiryHours: 72
  # 上下文窗口 token 上限 (默认: 65536)
  contextWindowTokens: 65536
  # 是否在新会话发送自我介绍 (默认: true)
  introductionEnabled: true
  # 自我介绍模板 (默认: "")
  introductionTemplate: ""
  # 历史图片保留时长(分钟) (默认: 30)
  historyImageTtlMinutes: 30
  # 历史中保留的最大图片数 (默认: 4)
  historyImageLimit: 4
  # 当前轮已带图时是否跳过历史图片 (默认: true)
  historyImageSkipIfCurrent: true
  # 群聊会话隔离策略:per_user 每人独立会话(默认,防群内串话),shared 整群共享一个会话 (默认: per_user) [per_user|shared]
  groupSessionScope: per_user

# ── memory ──
memory:
  # 是否启用认知记忆 (默认: true)
  enabled: true
  # 记忆作用域策略 (默认: session) [legacy|session]
  scopePolicy: session
  # 触发记忆整合的条目阈值 (默认: 20)
  consolidationThreshold: 20
  # 是否启用向量检索记忆 (默认: true)
  vectorEnabled: true
  # 记忆向量维度 (默认: 1536)
  vectorDimensions: 1536
  # 单用户记忆条目上限 (默认: 1000)
  maxUserMemories: 1000
  # 环境记忆条目上限 (默认: 500)
  maxEnvMemories: 500
  # 提示模型记录记忆的轮次间隔 (默认: 10)
  memoryNudgeInterval: 10
  # 记忆重要性衰减周期(天) (默认: 30.0)
  importanceDecayDays: 30.0
  # 是否启用记忆快照注入上下文 (默认: true)
  snapshotEnabled: true
  # 是否启用记忆矛盾检测 (默认: true)
  contradictionDetection: true
  # 是否启用空闲期记忆整合 (默认: true)
  sleepConsolidation: true
  # 记忆归档分数阈值,低于此值进入归档层 (默认: 0.05)
  archivalThreshold: 0.05
  # 记忆遗忘分数阈值,低于此值被遗忘 (默认: 0.01)
  forgetThreshold: 0.01
  # 工作记忆条目上限 (默认: 20)
  maxWorkingMemory: 20
  # 记忆向量化使用的嵌入模型 (默认: "")
  embeddingModel: ""
  # 查询向量化的单次超时(秒),超时降级为关键词检索 (默认: 1.5)
  embedTimeoutSeconds: 1.5
  # 是否在写入记忆时即时扫描矛盾 (默认: false)
  contradictionScanOnStore: false
  # 睡眠整合时自动消解同 key 矛盾(newest-wins),默认关闭只检测不消解 (默认: false)
  autoResolveContradictions: false

# ── knowledge ──
knowledge:
  # 是否启用知识库检索 (默认: true)
  enabled: true
  # 知识库文档目录 (默认: data/knowledge)
  docsDir: data/knowledge
  # 知识库索引文件路径 (默认: data/knowledge_index.json)
  indexPath: data/knowledge_index.json
  # 是否自动索引文档目录 (默认: true)
  autoIndex: true
  # 文档切块大小(字符) (默认: 1200)
  chunkSize: 1200
  # 相邻切块重叠大小(字符) (默认: 120)
  chunkOverlap: 120
  # 知识检索返回的最大结果数 (默认: 5)
  maxResults: 5
  # 允许索引的文档扩展名 (默认: ['.md', '.txt', '.rst', '.json', '.yaml', '.yml', '.py'])
  allowedExtensions: ['.md', '.txt', '.rst', '.json', '.yaml', '.yml', '.py']

# ── multiAgent ──
multiAgent:
  # 是否启用多代理委派 (默认: true)
  enabled: true
  # 委派嵌套最大深度 (默认: 3)
  maxDepth: 3
  # 并行子代理数上限 (默认: 4)
  maxParallelWorkers: 4
  # 子代理默认最大迭代数 (默认: 12)
  maxIterations: 12
  # 委派审计日志路径 (默认: data/delegation_audit.jsonl)
  auditPath: data/delegation_audit.jsonl
  # 子代理画像配置列表 (默认: [])
  workerProfiles: []

# ── scheduler ──
scheduler:
  # 是否启用任务调度器 (默认: true)
  enabled: true
  # 并发任务数上限 (默认: 10)
  maxConcurrentJobs: 10

# ── storage ──
storage:
  # SQLite 数据库文件路径 (默认: data/echo_agent.db)
  databasePath: data/echo_agent.db
  # 会话数据存储目录 (默认: data/sessions)
  sessionsDir: data/sessions
  # 记忆数据存储目录 (默认: data/memory)
  memoryDir: data/memory
  # 日志文件存储目录 (默认: data/logs)
  logsDir: data/logs

# ── observability ──
observability:
  # 日志级别 (默认: INFO)
  logLevel: INFO
  # 是否记录执行轨迹(关闭则不写 trace 文件) (默认: true)
  traceEnabled: true
  # trace 文件保留数量上限,超出按最旧优先轮转删除;<=0 表示不限制(禁用轮转) (默认: 500)
  maxTraceFiles: 500
  # 健康检查间隔(秒) (默认: 60)
  healthCheckIntervalSeconds: 60
  # 是否启用 OpenTelemetry 指标导出 (默认: true)
  otelEnabled: true
  # OpenTelemetry 导出端点 (默认: "")
  otelEndpoint: ""
  # OpenTelemetry 服务名 (默认: echo-agent)
  otelServiceName: echo-agent
  # OpenTelemetry 指标导出间隔(毫秒) (默认: 5000)
  otelExportIntervalMs: 5000

# ── skills ──
skills:
  # 技能脚本目录 (默认: skills)
  skillsDir: skills
  # 提示创建技能的轮次间隔 (默认: 10)
  creationNudgeInterval: 10
  # 禁用的技能列表 (默认: [])
  disabled: []
  # 额外加载技能的外部目录 (默认: [])
  externalDirs: []
  # 是否允许技能运行时按需安装依赖 (默认: true)
  allowLazyInstalls: true

# ── compression ──
compression:
  # 是否启用上下文压缩 (默认: true)
  enabled: true
  # 上下文占用达到该比例时触发压缩 (默认: 0.7)
  triggerRatio: 0.7
  # 压缩后保留尾部消息的预算比例 (默认: 0.4)
  tailBudgetRatio: 0.4
  # 压缩时保护不动的头部消息数 (默认: 3)
  headProtectCount: 3
  # 摘要相对原文的目标长度比例 (默认: 0.2)
  summaryTargetRatio: 0.2
  # 摘要最小 token 数 (默认: 2000)
  summaryMinTokens: 2000
  # 摘要最大 token 数 (默认: 12000)
  summaryMaxTokens: 12000
  # 生成摘要使用的模型 (默认: "")
  summaryModel: ""
  # 两次压缩之间的冷却时间(秒) (默认: 600)
  summaryCooldownSeconds: 600
  # 是否启用工具结果剪枝 (默认: true)
  toolPruningEnabled: true
  # 工具结果剪枝保留尾部的预算比例 (默认: 0.3)
  toolPruningTailBudgetRatio: 0.3
  # 单会话最大压缩次数 (默认: 10)
  maxCompressionCount: 10

# ── gateway ──
gateway:
  # 是否启用网关服务 (默认: false)
  enabled: false
  # 网关监听地址 (默认: 0.0.0.0)
  host: 0.0.0.0
  # 网关监听端口 (默认: 9000)
  port: 9000
  # 网关 API 路径前缀 (默认: /api/v1)
  apiPrefix: /api/v1
  # 网关 WebSocket 路径 (默认: /ws)
  wsPath: /ws
  sessionPolicy:
    # 网关会话重置策略 (默认: idle) [daily|idle|both|none]
    mode: idle
    # 每日重置会话的小时(0-23) (默认: 4)
    dailyResetHour: 4
    # 会话空闲超时(分钟) (默认: 1440)
    idleTimeoutMinutes: 1440
  auth:
    # 网关鉴权模式 (默认: allowlist) [open|allowlist|pairing]
    mode: allowlist
    # 允许访问网关的用户白名单 (默认: [])
    allowedUsers: []
    # 网关管理员用户列表 (默认: [])
    adminUsers: []
    # 网关 API 访问令牌列表 (默认: [])
    apiTokens: []
    # 高危管理接口(关停/技能导入安装删除/知识库上传删除)专用令牌；为空时回退到 api_tokens (默认: [])
    adminTokens: []
    # 浏览器 Origin 白名单(CSRF 防护)；留空则不启用 CSRF 检查(默认),配置后仅放行白名单内的跨站浏览器请求,非浏览器客户端始终不受影响 (默认: [])
    allowedOrigins: []
    # 携带 API 令牌的请求头名 (默认: X-Echo-Agent-Token)
    tokenHeader: X-Echo-Agent-Token
    # 配对模式令牌有效期(秒) (默认: 300)
    pairingTtlSeconds: 300
  # 各接入平台的网关配置(键为平台名) (默认: {})
  platforms: {}
  # 网关媒体缓存目录 (默认: data/media_cache)
  mediaCacheDir: data/media_cache
  # 媒体缓存大小上限(MB) (默认: 500)
  mediaCacheMaxMb: 500
  # 是否向网关客户端推送进度事件 (默认: true)
  emitProgressEvents: true
  # 是否输出进度事件调试信息 (默认: false)
  progressDebug: false
  # 网关钩子脚本目录 (默认: "")
  hooksDir: ""

# ── planning ──
planning:
  # 是否启用任务规划 (默认: true)
  enabled: true
  # 默认规划策略 (默认: auto)
  defaultStrategy: auto
  # 规划树最大深度 (默认: 5)
  maxTreeDepth: 5
  # 思维树(ToT)策略探索的候选分支数 (默认: 3)
  maxBranches: 3
  # 是否启用规划反思 (默认: true)
  reflectionEnabled: true

# ── a2A ──
a2A:
  # 是否启用 A2A(agent-to-agent)接口 (默认: true)
  enabled: true
  # 对外暴露的 A2A 代理名 (默认: echo-agent)
  agentName: echo-agent
  # 对外暴露的 A2A 代理描述 (默认: A modular AI agent framework)
  agentDescription: A modular AI agent framework
  # A2A AgentCard 对外声明的能力标签 (默认: ['chat', 'tool_use'])
  capabilities: ['chat', 'tool_use']

# ── evaluation ──
evaluation:
  # 评测数据集路径 (默认: data/eval)
  datasetPath: data/eval
  # 单条评测用例超时(秒) (默认: 120)
  timeoutPerCase: 120

# ── bus ──
bus:
  # 事件总线队列容量上限 (默认: 1000)
  maxQueueSize: 1000
  # 事件总线并发处理上限 (默认: 50)
  maxConcurrency: 50

# ── rateLimit ──
rateLimit:
  # 单会话每分钟请求上限 (默认: 20)
  sessionRpm: 20
  # 单会话突发请求上限 (默认: 5)
  sessionBurst: 5

# ── circuitBreaker ──
circuitBreaker:
  # 触发熔断的连续失败次数 (默认: 5)
  failureThreshold: 5
  # 熔断后尝试恢复的等待时间(秒) (默认: 60.0)
  recoverySeconds: 60.0
  # 半开状态允许的试探请求数 (默认: 2)
  halfOpenMax: 2

# ── plugins ──
plugins:
  # 是否启用插件系统 (默认: true)
  enabled: true
  # 允许加载的插件白名单 (默认: [])
  allow: []
  # 禁止加载的插件黑名单 (默认: [])
  deny: []
  # 额外的插件搜索目录 (默认: [])
  extraDirs: []
  # 各插件的自定义配置(键为插件名) (默认: {})
  config: {}
  # 免权限校验的可信插件列表 (默认: [])
  trustedPlugins: []
  # 插件权限模式 (默认: compat) [compat|strict]
  permissionMode: compat

# ── ui ──
ui:
  # 界面语言 (默认: auto) [en|zh|auto]
  locale: auto

# ── agent ──
agent:
  # agent 主循环最大迭代数 (默认: 40)
  maxIterations: 40

# ── evolution ──
evolution:
  # 是否启用自进化技能引擎 (默认: false)
  enabled: false
  # 进化触发模式 (默认: manual) [manual|threshold|scheduled]
  triggerMode: manual
  # threshold 模式触发所需轨迹数 (默认: 50)
  thresholdTrajectories: 50
  # scheduled 模式的 cron 表达式 (默认: 0 4 * * *)
  cronExpression: 0 4 * * *
  # 单次进化生成的候选上限 (默认: 3)
  maxCandidatesPerRun: 3
  # 单次进化处理的轨迹上限 (默认: 200)
  maxTrajectoriesPerRun: 200
  # 进化评测基线数据集路径 (默认: data/eval/baseline.yaml)
  evalDatasetPath: data/eval/baseline.yaml
  # 判定回归的分数下降阈值 (默认: 0.05)
  regressionThreshold: 0.05
  # 是否要求严格改进才晋升 (默认: true)
  requireStrictImprovement: true
  # 晋升所需的最小评测用例数,样本不足则判定不确定不晋升 (默认: 3)
  minEvalCases: 3
  # 是否记录执行轨迹用于进化 (默认: true)
  recordTrajectories: true
  # 轨迹保留天数 (默认: 30)
  trajectoryRetentionDays: 30
  # 执行进化所用模型 (默认: "")
  evolverModel: ""
  # 进化产出技能的大小上限(字节) (默认: 50000)
  skillSizeLimitBytes: 50000
  # 记录轨迹时是否脱敏工具参数 (默认: true)
  redactArgs: true
  # 进化评测并发度 (默认: 2)
  evalParallel: 2
  # 进化评测单用例超时(秒) (默认: 60)
  evalTimeoutSeconds: 60
  # 晋升后再次进化的冷却时间(秒) (默认: 86400)
  cooldownSecondsAfterPromote: 86400
  # 是否自动晋升通过评测的候选 (默认: true)
  autoPromote: true
  # 晋升前是否需要人工审查候选 (默认: false)
  candidateReviewRequired: false

# ── cost ──
cost:
  # 是否启用成本追踪与预算控制 (默认: false)
  enabled: false
  # 每日成本预算(美元,0 为不限) (默认: 0.0)
  dailyBudgetUsd: 0.0
  # 达到预算该比例时发出软告警 (默认: 0.8)
  softThresholdRatio: 0.8
  # 模型定价覆盖表 (默认: {})
  pricingOverrides: {}

# ── workspace ──
# agent 工作区根目录 (默认: ~/.echo-agent)
workspace: ~/.echo-agent
