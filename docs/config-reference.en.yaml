# Echo Agent configuration reference (auto-generated, do not edit)

# ── security ──
security:
  # Overall security profile preset (default: personal_cli) [personal_cli|daemon|public_gateway]
  profile: personal_cli

# ── channels ──
channels:
  telegram:
    # Enable the Telegram channel (default: false)
    enabled: false
    # Telegram bot API token (default: "")
    token: ""
    # Allowlist of user IDs permitted to interact (empty = all) (default: [])
    allowFrom: []
    # Proxy URL used to reach the Telegram API (default: null)
    proxy: null
    # Group reply policy: open = all messages, mention = only when @-mentioned (default: mention) [open|mention]
    groupPolicy: mention
    # Whether to add emoji reactions to messages (default: true)
    reactionsEnabled: true
  discord:
    # Enable the Discord channel (default: false)
    enabled: false
    # Discord bot token (default: "")
    token: ""
    # Allowlist of user IDs permitted to interact (empty = all) (default: [])
    allowFrom: []
    # Group reply policy: open = all messages, mention = only when @-mentioned (default: mention) [open|mention]
    groupPolicy: mention
    # Whether to add emoji reactions to messages (default: true)
    reactionsEnabled: true
  webhook:
    # Enable the webhook channel (default: false)
    enabled: false
    # Webhook server bind address (default: 0.0.0.0)
    host: 0.0.0.0
    # Webhook server listen port (default: 8080)
    port: 8080
    # Secret used to verify inbound request signatures (default: "")
    secret: ""
    # HTTP path on which webhooks are received (default: /webhook)
    path: /webhook
    # Maximum number of pending webhook requests queued (default: 1000)
    maxPending: 1000
  cli:
    # Enable the CLI channel (default: true)
    enabled: true
  cron:
    # Enable the cron channel (default: false)
    enabled: false
  slack:
    # Enable the Slack channel (default: false)
    enabled: false
    # Slack bot token (xoxb-) (default: "")
    botToken: ""
    # Slack app-level token (xapp-) for Socket Mode (default: "")
    appToken: ""
    # Allowlist of user IDs permitted to interact (empty = all) (default: [])
    allowFrom: []
    # Whether to add emoji reactions to messages (default: true)
    reactionsEnabled: true
  whatsapp:
    # Enable the WhatsApp channel (default: false)
    enabled: false
    # WhatsApp webhook verification token (default: "")
    verifyToken: ""
    # WhatsApp Cloud API access token (default: "")
    accessToken: ""
    # WhatsApp phone number ID used for sending (default: "")
    phoneNumberId: ""
    # HTTP path on which WhatsApp webhooks are received (default: /whatsapp)
    webhookPath: /whatsapp
    # WhatsApp server bind address (default: 0.0.0.0)
    host: 0.0.0.0
    # WhatsApp server listen port (default: 8081)
    port: 8081
  weixin:
    # Enable the Weixin channel (default: false)
    enabled: false
    # Weixin customer-service account ID (default: "")
    accountId: ""
    # Weixin access authentication token (default: "")
    token: ""
    # Weixin API base URL (default: https://ilinkai.weixin.qq.com)
    baseUrl: https://ilinkai.weixin.qq.com
    # Weixin media CDN base URL (default: https://novac2c.cdn.weixin.qq.com/c2c)
    cdnBaseUrl: https://novac2c.cdn.weixin.qq.com/c2c
    # Allowlist of user IDs permitted to interact (empty = all) (default: [])
    allowFrom: []
    # Direct-message reply policy (default: open)
    dmPolicy: open
    # Local data directory for the Weixin channel (default: "")
    dataDir: ""
  qqbot:
    # Enable the QQ bot channel (default: false)
    enabled: false
    # QQ bot AppID (default: "")
    appId: ""
    # QQ bot AppSecret (default: "")
    appSecret: ""
    # Allowlist of user IDs permitted to interact (empty = all) (default: [])
    allowFrom: []
    # Use the QQ sandbox environment (default: false)
    sandbox: false
    # Enable Markdown message support (default: false)
    markdownSupport: false
    # Enable media (image/file) sending and receiving (default: true)
    mediaEnabled: true
    # Maximum size per uploaded media file (MB) (default: 20)
    mediaMaxFileSizeMb: 20
    # Maximum number of cached media upload results (default: 500)
    mediaUploadCacheSize: 500
    # Parse media tags embedded in messages (default: true)
    mediaParseTags: true
  feishu:
    # Enable the Feishu channel (default: false)
    enabled: false
    # Feishu app ID (default: "")
    appId: ""
    # Feishu app secret (default: "")
    appSecret: ""
    # Feishu event callback verification token (default: "")
    verificationToken: ""
    # Feishu event encryption key (default: "")
    encryptionKey: ""
    # HTTP path on which Feishu events are received (default: /feishu)
    webhookPath: /feishu
    # Feishu server bind address (default: 0.0.0.0)
    host: 0.0.0.0
    # Feishu server listen port (default: 8083)
    port: 8083
  dingtalk:
    # Enable the DingTalk channel (default: false)
    enabled: false
    # DingTalk app key (default: "")
    appKey: ""
    # DingTalk app secret (default: "")
    appSecret: ""
    # DingTalk robot code (default: "")
    robotCode: ""
    # Allowlist of user IDs permitted to interact (empty = all) (default: [])
    allowFrom: []
  email:
    # Enable the email channel (default: false)
    enabled: false
    # IMAP server host for receiving mail (default: "")
    imapHost: ""
    # IMAP server port for receiving mail (default: 993)
    imapPort: 993
    # SMTP server host for sending mail (default: "")
    smtpHost: ""
    # SMTP server port for sending mail (default: 465)
    smtpPort: 465
    # Mailbox login username (default: "")
    username: ""
    # Mailbox login password or app token (default: "")
    password: ""
    # Use SSL when connecting to mail servers (default: true)
    useSsl: true
    # Interval between new-mail polls (seconds) (default: 30)
    pollIntervalSeconds: 30
    # Allowlist of sender addresses permitted to interact (empty = all) (default: [])
    allowFrom: []
  wecom:
    # Enable the WeCom channel (default: false)
    enabled: false
    # WeCom corporation ID (default: "")
    corpId: ""
    # WeCom application AgentId (default: "")
    agentId: ""
    # WeCom application secret (default: "")
    secret: ""
    # WeCom callback verification token (default: "")
    token: ""
    # EncodingAESKey for WeCom encrypted callbacks; empty means plaintext mode (default: "")
    encodingAesKey: ""
    # HTTP path on which WeCom events are received (default: /wecom)
    webhookPath: /wecom
    # WeCom server bind address (default: 0.0.0.0)
    host: 0.0.0.0
    # WeCom server listen port (default: 8084)
    port: 8084
  matrix:
    # Enable the Matrix channel (default: false)
    enabled: false
    # Matrix homeserver URL (default: "")
    homeserver: ""
    # Matrix bot user ID (default: "")
    userId: ""
    # Matrix access token (default: "")
    accessToken: ""
    # Allowlist of room IDs the bot responds in (empty = all) (default: [])
    allowRooms: []
    # Whether to add emoji reactions to messages (default: true)
    reactionsEnabled: true
  # Send progress updates to the user (default: true)
  sendProgress: true
  # Send tool-invocation hints to the user (default: true)
  sendToolHints: true
  # Channels for which streaming incremental replies are enabled (default: ['cli', 'telegram', 'discord', 'slack', 'gateway:*'])
  streamChannels: ['cli', 'telegram', 'discord', 'slack', 'gateway:*']
  # Character count that triggers a streaming flush (default: 180)
  streamFlushChars: 180
  # Maximum interval between streaming flushes (ms) (default: 1500)
  streamFlushIntervalMs: 1500
  # Flush streaming output on paragraph boundaries (default: true)
  streamParagraphMode: true
  # API key for the voice transcription service (default: "")
  transcriptionApiKey: ""

# ── models ──
models:
  # Default model used when no route matches (default: "")
  defaultModel: ""
  # List of model provider configurations (default: [])
  providers: []
  # List of task-to-model routing rules (default: [])
  routes: []
  # Global fallback model (default: "")
  fallbackModel: ""

# ── tools ──
tools:
  # Preset tool profile (default: full) [minimal|messaging|coding|full]
  profile: full
  # Explicit allowlist of tools overriding the profile (default: [])
  allow: []
  # Tools additionally allowed on top of the profile (default: [])
  alsoAllow: []
  # Explicit blocklist of tools (default: [])
  deny: []
  exec:
    # Enable the shell/process execution tool (default: true)
    enabled: true
    # Maximum characters of command output before truncation (default: 16000)
    maxOutputChars: 16000
    # Host environment in which commands execute (default: sandbox) [auto|local|sandbox|container|remote]
    host: sandbox
    # Command execution security mode (default: allowlist) [deny|allowlist|full]
    security: allowlist
    # When to ask for approval before running a command (default: on_miss) [off|on_miss|always]
    ask: on_miss
    # Commands allowed without approval under allowlist mode (default: ['awk', 'cat', 'date', 'echo', 'find', 'grep', 'head', 'ls', 'pwd', 'rg', 'sed', 'sort', 'tail', 'tr', 'uniq', 'wc'])
    safeBins: ['awk', 'cat', 'date', 'echo', 'find', 'grep', 'head', 'ls', 'pwd', 'rg', 'sed', 'sort', 'tail', 'tr', 'uniq', 'wc']
    # Additional allowlist of commands permitted to run (default: [])
    allowedCommands: []
    # Blocklist of commands forbidden from running (default: [])
    blockedCommands: []
  web:
    # Enable the web access tool (default: false)
    enabled: false
    # Proxy URL used for web access (default: null)
    proxy: null
    # Web request timeout (seconds) (default: 30)
    timeoutSeconds: 30
    # Search service API key (default: "")
    searchApiKey: ""
    # Web search service provider (default: brave) [brave|tavily|serpapi|searxng]
    searchProvider: brave
    # Search service API base URL (default: "")
    searchApiBase: ""
    # Allow web_fetch to reach private/loopback addresses (SSRF risk) (default: false)
    allowPrivateAddresses: false
  # Restrict file operations to the workspace (default: false)
  restrictToWorkspace: false
  # Root directory under which writes are permitted (default: "")
  safeWriteRoot: ""
  # Auto download, decrypt and parse inbound document attachments (default: true)
  inboundDocumentEnabled: true
  # Char cap for auto-injecting inbound document text; beyond it, inject a summary and hint read_document (default: 8000)
  inboundDocumentMaxChars: 8000
  # MCP server configurations keyed by name (default: {})
  mcpServers: {}
  # MCP tool security policy: warn or block (default: block) [warn|block]
  mcpSecurityPolicy: block
  imageGen:
    # Image generation backend (default: openai)
    backend: openai
    # OpenAI-compatible backend API key (default: "")
    apiKey: ""
    # OpenAI-compatible backend API base URL (default: "")
    apiBase: ""
    # Image generation model name (default: "")
    model: ""
    # FAL.ai backend access key (default: "")
    falKey: ""
    # FAL.ai image generation model name (default: "")
    falModel: ""
  tts:
    # OpenAI TTS API key (default: "")
    openaiApiKey: ""
    # OpenAI TTS API base URL (default: "")
    openaiApiBase: ""
    # TTS model name (default: "")
    model: ""
    # Default text-to-speech backend (default: edge)
    defaultBackend: edge
    # Default synthesis voice (default: "")
    defaultVoice: ""
  codeExec:
    # Enable the code execution tool (default: true)
    enabled: true
    # Code execution timeout (seconds) (default: 30)
    timeoutSeconds: 30
    # Languages permitted for code execution (default: ['python', 'javascript', 'bash'])
    allowedLanguages: ['python', 'javascript', 'bash']

# ── execution ──
execution:
  # Default command executor type (default: sandbox) [local|sandbox|container|remote]
  defaultExecutor: sandbox
  # Root directory for the sandbox executor (default: /tmp/echo-agent-sandbox)
  sandboxRoot: /tmp/echo-agent-sandbox
  # Image used by the container executor (default: "")
  containerImage: ""
  # Target host for the remote executor (default: "")
  remoteHost: ""
  # Login user for the remote executor (default: root)
  remoteUser: root
  # SSH private key path for the remote executor (default: "")
  remoteKeyPath: ""
  # SSH strict host key checking policy (default: accept-new) [no|accept-new|yes]
  remoteStrictHostKey: accept-new
  # Remote executor connection timeout (seconds) (default: 10)
  remoteConnectTimeout: 10
  # Network access policy for the execution environment (default: deny) [allow|deny|restricted]
  networkPolicy: deny

# ── permissions ──
permissions:
  # Global administrator users (default: [])
  adminUsers: []
  approval:
    # Tools/actions that require approval before running (default: ['cronjob', 'dep_install', 'exec', 'execute_code', 'process', 'skill_install', 'skill_manage'])
    requireApproval: ['cronjob', 'dep_install', 'exec', 'execute_code', 'process', 'skill_install', 'skill_manage']
    # Tools/actions auto-approved without prompting (default: [])
    autoApprove: []
    # Tools/actions auto-denied (default: [])
    autoDeny: []
    # Default approval policy when no rule matches (default: approve) [approve|deny|ask]
    defaultPolicy: approve
    # Timeout while waiting for human approval (seconds) (default: 300)
    waitTimeoutSeconds: 300
    # Auto-approve actions on the CLI channel (default: true)
    cliAutoApprove: true
    # Trusted channels exempt from approval (default: [])
    trustedChannels: []
    # Approval mode: manual, smart, or off (default: smart) [manual|smart|off]
    mode: smart
    # Model used to judge approvals in smart mode (default: "")
    smartModel: ""
    # Approval policy when running unattended (default: deny) [deny|allow_safe]
    unattendedPolicy: deny
  elevated:
    # Enable the elevated-permission mechanism (default: false)
    enabled: false
    # Per-channel mapping of users allowed to elevate (default: {})
    allowFrom: {}

# ── credentials ──
credentials:
  # Environment variable holding the credential encryption key (default: ECHO_AGENT_CREDENTIAL_KEY)
  encryptionKeyEnv: ECHO_AGENT_CREDENTIAL_KEY
  # Require credential encryption (default: true)
  requireEncryption: true

# ── session ──
session:
  # Maximum history messages retained per session (default: 500)
  maxHistoryMessages: 500
  # Session expiry time (hours) (default: 72)
  expiryHours: 72
  # Context window token budget (default: 65536)
  contextWindowTokens: 65536
  # Send a self-introduction on new sessions (default: true)
  introductionEnabled: true
  # Self-introduction template (default: "")
  introductionTemplate: ""
  # Time-to-live for images in history (minutes) (default: 30)
  historyImageTtlMinutes: 30
  # Maximum images retained in history (default: 4)
  historyImageLimit: 4
  # Skip history images when the current turn already has one (default: true)
  historyImageSkipIfCurrent: true
  # Group session scope: per_user = isolate per sender (default), shared = whole group shares one session (default: per_user) [per_user|shared]
  groupSessionScope: per_user

# ── memory ──
memory:
  # Enable cognitive memory (default: true)
  enabled: true
  # Memory scope policy (default: session) [legacy|session]
  scopePolicy: session
  # Entry threshold that triggers memory consolidation (default: 20)
  consolidationThreshold: 20
  # Enable vector-based memory retrieval (default: true)
  vectorEnabled: true
  # Memory embedding vector dimensions (default: 1536)
  vectorDimensions: 1536
  # Maximum stored memories per user (default: 1000)
  maxUserMemories: 1000
  # Maximum stored environment memories (default: 500)
  maxEnvMemories: 500
  # Turn interval for nudging the model to store memories (default: 10)
  memoryNudgeInterval: 10
  # Memory importance decay period (days) (default: 30.0)
  importanceDecayDays: 30.0
  # Inject memory snapshots into context (default: true)
  snapshotEnabled: true
  # Enable memory contradiction detection (default: true)
  contradictionDetection: true
  # Enable idle-time (sleep) memory consolidation (default: true)
  sleepConsolidation: true
  # Archival score threshold; entries below it move to the archival tier (default: 0.05)
  archivalThreshold: 0.05
  # Forget score threshold; entries below it are forgotten (default: 0.01)
  forgetThreshold: 0.01
  # Maximum working-memory entries (default: 20)
  maxWorkingMemory: 20
  # Embedding model used for memory vectorization (default: "")
  embeddingModel: ""
  # Query-embedding timeout (seconds); falls back to keyword search on timeout (default: 1.5)
  embedTimeoutSeconds: 1.5
  # Scan for contradictions at memory store time (default: false)
  contradictionScanOnStore: false
  # Auto-resolve same-key contradictions (newest-wins) during sleep consolidation; off by default (default: false)
  autoResolveContradictions: false

# ── knowledge ──
knowledge:
  # Enable knowledge-base retrieval (default: true)
  enabled: true
  # Knowledge base documents directory (default: data/knowledge)
  docsDir: data/knowledge
  # Knowledge base index file path (default: data/knowledge_index.json)
  indexPath: data/knowledge_index.json
  # Automatically index the documents directory (default: true)
  autoIndex: true
  # Document chunk size (characters) (default: 1200)
  chunkSize: 1200
  # Overlap between adjacent chunks (characters) (default: 120)
  chunkOverlap: 120
  # Maximum knowledge retrieval results returned (default: 5)
  maxResults: 5
  # Document extensions eligible for indexing (default: ['.md', '.txt', '.rst', '.json', '.yaml', '.yml', '.py'])
  allowedExtensions: ['.md', '.txt', '.rst', '.json', '.yaml', '.yml', '.py']

# ── multiAgent ──
multiAgent:
  # Enable multi-agent delegation (default: true)
  enabled: true
  # Maximum delegation nesting depth (default: 3)
  maxDepth: 3
  # Maximum parallel workers (default: 4)
  maxParallelWorkers: 4
  # Default maximum iterations per worker (default: 12)
  maxIterations: 12
  # Delegation audit log path (default: data/delegation_audit.jsonl)
  auditPath: data/delegation_audit.jsonl
  # List of worker profile configurations (default: [])
  workerProfiles: []

# ── scheduler ──
scheduler:
  # Enable the task scheduler (default: true)
  enabled: true
  # Maximum concurrent scheduled jobs (default: 10)
  maxConcurrentJobs: 10

# ── storage ──
storage:
  # SQLite database file path (default: data/echo_agent.db)
  databasePath: data/echo_agent.db
  # Directory storing session data (default: data/sessions)
  sessionsDir: data/sessions
  # Directory storing memory data (default: data/memory)
  memoryDir: data/memory
  # Directory storing log files (default: data/logs)
  logsDir: data/logs

# ── observability ──
observability:
  # Logging level (default: INFO)
  logLevel: INFO
  # Whether to record execution traces (off disables trace files) (default: true)
  traceEnabled: true
  # Max retained trace files; oldest are rotated out when exceeded; <=0 disables rotation (default: 500)
  maxTraceFiles: 500
  # Health check interval (seconds) (default: 60)
  healthCheckIntervalSeconds: 60
  # Enable OpenTelemetry metrics export (default: true)
  otelEnabled: true
  # OpenTelemetry export endpoint (default: "")
  otelEndpoint: ""
  # OpenTelemetry service name (default: echo-agent)
  otelServiceName: echo-agent
  # OpenTelemetry metrics export interval (ms) (default: 5000)
  otelExportIntervalMs: 5000

# ── skills ──
skills:
  # Skills directory (default: skills)
  skillsDir: skills
  # Turn interval for nudging skill creation (default: 10)
  creationNudgeInterval: 10
  # List of disabled skills (default: [])
  disabled: []
  # External directories from which to load skills (default: [])
  externalDirs: []
  # Allow lazy on-demand dependency installs for skills (default: true)
  allowLazyInstalls: true

# ── compression ──
compression:
  # Enable context compression (default: true)
  enabled: true
  # Context usage ratio that triggers compression (default: 0.7)
  triggerRatio: 0.7
  # Budget ratio reserved for tail messages after compression (default: 0.4)
  tailBudgetRatio: 0.4
  # Number of head messages protected from compression (default: 3)
  headProtectCount: 3
  # Target summary length relative to source (default: 0.2)
  summaryTargetRatio: 0.2
  # Minimum summary tokens (default: 2000)
  summaryMinTokens: 2000
  # Maximum summary tokens (default: 12000)
  summaryMaxTokens: 12000
  # Model used to generate summaries (default: "")
  summaryModel: ""
  # Cooldown between compressions (seconds) (default: 600)
  summaryCooldownSeconds: 600
  # Enable pruning of tool results (default: true)
  toolPruningEnabled: true
  # Tail budget ratio retained when pruning tool results (default: 0.3)
  toolPruningTailBudgetRatio: 0.3
  # Maximum compressions per session (default: 10)
  maxCompressionCount: 10

# ── gateway ──
gateway:
  # Enable the gateway service (default: false)
  enabled: false
  # Gateway bind address (default: 0.0.0.0)
  host: 0.0.0.0
  # Gateway listen port (default: 9000)
  port: 9000
  # Gateway API path prefix (default: /api/v1)
  apiPrefix: /api/v1
  # Gateway WebSocket path (default: /ws)
  wsPath: /ws
  sessionPolicy:
    # Gateway session reset policy (default: idle) [daily|idle|both|none]
    mode: idle
    # Hour of day to reset sessions (0-23) (default: 4)
    dailyResetHour: 4
    # Session idle timeout (minutes) (default: 1440)
    idleTimeoutMinutes: 1440
  auth:
    # Gateway authentication mode (default: allowlist) [open|allowlist|pairing]
    mode: allowlist
    # Allowlist of users permitted to access the gateway (default: [])
    allowedUsers: []
    # Gateway administrator users (default: [])
    adminUsers: []
    # Gateway API access tokens (default: [])
    apiTokens: []
    # Tokens required for high-risk admin endpoints (shutdown, skills import/install/delete, knowledge upload/delete); falls back to api_tokens when empty (default: [])
    adminTokens: []
    # Allowlisted browser Origins (CSRF protection); empty disables the CSRF check (default). When set, only listed cross-site browser requests pass; non-browser clients are always unaffected (default: [])
    allowedOrigins: []
    # Request header carrying the API token (default: X-Echo-Agent-Token)
    tokenHeader: X-Echo-Agent-Token
    # Pairing-mode token time-to-live (seconds) (default: 300)
    pairingTtlSeconds: 300
  # Per-platform gateway configurations keyed by platform (default: {})
  platforms: {}
  # Gateway media cache directory (default: data/media_cache)
  mediaCacheDir: data/media_cache
  # Media cache size limit (MB) (default: 500)
  mediaCacheMaxMb: 500
  # Emit progress events to gateway clients (default: true)
  emitProgressEvents: true
  # Emit progress-event debug information (default: false)
  progressDebug: false
  # Gateway hook scripts directory (default: "")
  hooksDir: ""

# ── planning ──
planning:
  # Enable task planning (default: true)
  enabled: true
  # Default planning strategy (default: auto)
  defaultStrategy: auto
  # Maximum planning tree depth (default: 5)
  maxTreeDepth: 5
  # Number of candidate branches the Tree-of-Thought strategy explores (default: 3)
  maxBranches: 3
  # Enable planning reflection (default: true)
  reflectionEnabled: true

# ── a2A ──
a2A:
  # Enable the A2A (agent-to-agent) interface (default: true)
  enabled: true
  # Agent name exposed over A2A (default: echo-agent)
  agentName: echo-agent
  # Agent description exposed over A2A (default: A modular AI agent framework)
  agentDescription: A modular AI agent framework
  # Capability tags advertised in the A2A AgentCard (default: ['chat', 'tool_use'])
  capabilities: ['chat', 'tool_use']

# ── evaluation ──
evaluation:
  # Evaluation dataset path (default: data/eval)
  datasetPath: data/eval
  # Timeout per evaluation case (seconds) (default: 120)
  timeoutPerCase: 120

# ── bus ──
bus:
  # Event bus queue capacity (default: 1000)
  maxQueueSize: 1000
  # Event bus max concurrent handlers (default: 50)
  maxConcurrency: 50

# ── rateLimit ──
rateLimit:
  # Per-session requests-per-minute cap (default: 20)
  sessionRpm: 20
  # Per-session burst allowance (default: 5)
  sessionBurst: 5

# ── circuitBreaker ──
circuitBreaker:
  # Consecutive failures that trip the breaker (default: 5)
  failureThreshold: 5
  # Wait before attempting recovery after tripping (seconds) (default: 60.0)
  recoverySeconds: 60.0
  # Probe requests allowed in half-open state (default: 2)
  halfOpenMax: 2

# ── plugins ──
plugins:
  # Enable the plugin system (default: true)
  enabled: true
  # Allowlist of plugins permitted to load (default: [])
  allow: []
  # Blocklist of plugins forbidden from loading (default: [])
  deny: []
  # Additional plugin search directories (default: [])
  extraDirs: []
  # Per-plugin custom configuration keyed by plugin (default: {})
  config: {}
  # Trusted plugins exempt from permission checks (default: [])
  trustedPlugins: []
  # Plugin permission mode (default: compat) [compat|strict]
  permissionMode: compat

# ── ui ──
ui:
  # Interface language (default: auto) [en|zh|auto]
  locale: auto

# ── agent ──
agent:
  # Maximum iterations of the agent main loop (default: 40)
  maxIterations: 40

# ── evolution ──
evolution:
  # Enable the self-evolving skill engine (default: false)
  enabled: false
  # Evolution trigger mode (default: manual) [manual|threshold|scheduled]
  triggerMode: manual
  # Trajectory count triggering threshold mode (default: 50)
  thresholdTrajectories: 50
  # Cron expression for scheduled mode (default: 0 4 * * *)
  cronExpression: 0 4 * * *
  # Maximum candidates generated per run (default: 3)
  maxCandidatesPerRun: 3
  # Maximum trajectories processed per run (default: 200)
  maxTrajectoriesPerRun: 200
  # Evolution evaluation baseline dataset path (default: data/eval/baseline.yaml)
  evalDatasetPath: data/eval/baseline.yaml
  # Score-drop threshold that flags a regression (default: 0.05)
  regressionThreshold: 0.05
  # Require strict improvement before promotion (default: true)
  requireStrictImprovement: true
  # Minimum eval cases required to promote; fewer is inconclusive (default: 3)
  minEvalCases: 3
  # Record execution trajectories for evolution (default: true)
  recordTrajectories: true
  # Trajectory retention period (days) (default: 30)
  trajectoryRetentionDays: 30
  # Model used to perform evolution (default: "")
  evolverModel: ""
  # Size limit for evolved skills (bytes) (default: 50000)
  skillSizeLimitBytes: 50000
  # Redact tool arguments when recording trajectories (default: true)
  redactArgs: true
  # Evolution evaluation parallelism (default: 2)
  evalParallel: 2
  # Evolution evaluation per-case timeout (seconds) (default: 60)
  evalTimeoutSeconds: 60
  # Cooldown after a promotion before evolving again (seconds) (default: 86400)
  cooldownSecondsAfterPromote: 86400
  # Auto-promote candidates that pass evaluation (default: true)
  autoPromote: true
  # Require human review of candidates before promotion (default: false)
  candidateReviewRequired: false

# ── cost ──
cost:
  # Enable cost tracking and budget control (default: false)
  enabled: false
  # Daily cost budget in USD (0 = unlimited) (default: 0.0)
  dailyBudgetUsd: 0.0
  # Budget ratio at which a soft warning is raised (default: 0.8)
  softThresholdRatio: 0.8
  # Model pricing override table (default: {})
  pricingOverrides: {}

# ── workspace ──
# Agent workspace root directory (default: ~/.echo-agent)
workspace: ~/.echo-agent
