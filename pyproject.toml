[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-agent"
version = "0.3.0"
description = "A self-hosted, long-running AI agent runtime with memory, skills, plugins, and multi-channel integrations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Echo Agent contributors" }]
keywords = ["ai", "agent", "runtime", "memory", "plugins", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "croniter>=1.4",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/fuyuxiang/echo-agent"
Repository = "https://github.com/fuyuxiang/echo-agent"
Issues = "https://github.com/fuyuxiang/echo-agent/issues"
Discussions = "https://github.com/fuyuxiang/echo-agent/discussions"

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.40"]
bedrock = ["anthropic>=0.40", "boto3>=1.34"]
gemini = ["google-generativeai>=0.8"]
allproviders = ["openai>=1.30", "anthropic>=0.40", "boto3>=1.34", "google-generativeai>=0.8"]
vector = ["faiss-cpu>=1.7"]
container = ["docker>=7.0"]
process = ["psutil>=5.9"]
fal = ["fal-client>=0.5"]
weixin = ["cryptography>=41.0"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp>=1.20"]
tokenizers = ["tiktoken>=0.7"]
documents = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
all = ["openai>=1.30", "anthropic>=0.40", "boto3>=1.34", "google-generativeai>=0.8", "psutil>=5.9", "faiss-cpu>=1.7", "cryptography>=41.0", "tiktoken>=0.7", "fal-client>=0.5", "pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-asyncio>=0.23"]
skills = [
    "duckduckgo_search>=7.0",
    "trafilatura>=2.0",
    "feedparser>=6.0",
    "croniter>=1.4",
    "caldav>=1.3",
    "icalendar>=5.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "edge-tts>=7.0",
    "faster-whisper>=1.0",
    "psutil>=5.9",
]

[project.scripts]
echo-agent = "echo_agent.__main__:main"

[project.entry-points."echo_agent.plugins"]
# External plugins register here via their own pyproject.toml

[tool.hatch.build]
include = [
    "echo_agent/**/*.py",
    "echo_agent/config/**/*.yaml",
    "echo_agent/gateway/static/**/*",
    "skills/**/*.md",
    "skills/**/*.py",
    "skills/**/*.sh",
    "README.md",
    "LICENSE",
    "scripts/install.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["echo_agent"]

[tool.hatch.build.targets.wheel.sources]
"echo_agent" = "echo_agent"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "echo_agent/_bundled/skills"

[tool.hatch.build.targets.sdist]
include = [
    "echo_agent/",
    "skills/",
    "scripts/install.sh",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py311"
