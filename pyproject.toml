[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-agent"
version = "0.3.3"
description = "A self-hosted, long-running AI agent runtime with memory, skills, plugins, and multi-channel integrations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Echo Agent contributors" }]
keywords = ["ai", "agent", "runtime", "memory", "plugins", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "croniter>=1.4",
    "numpy>=1.24",
    "fastembed>=0.4",
]

[project.urls]
Homepage = "https://github.com/fuyuxiang/echo-agent"
Repository = "https://github.com/fuyuxiang/echo-agent"
Issues = "https://github.com/fuyuxiang/echo-agent/issues"
Discussions = "https://github.com/fuyuxiang/echo-agent/discussions"

[project.optional-dependencies]
openai = ["openai>=1.30", "httpx[socks]>=0.23"]
anthropic = ["anthropic>=0.40", "httpx[socks]>=0.23"]
bedrock = ["anthropic>=0.40", "boto3>=1.34", "httpx[socks]>=0.23"]
gemini = ["google-generativeai>=0.8"]
allproviders = ["openai>=1.30", "anthropic>=0.40", "boto3>=1.34", "google-generativeai>=0.8", "httpx[socks]>=0.23"]
vector = ["faiss-cpu>=1.7"]
container = ["docker>=7.0"]
process = ["psutil>=5.9"]
fal = ["fal-client>=0.5"]
weixin = ["cryptography>=41.0", "pilk>=0.2.4", "imageio-ffmpeg>=0.4.9"]
browser = ["playwright>=1.40"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp>=1.20"]
tokenizers = ["tiktoken>=0.7"]
documents = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
tui = ["textual>=0.60"]
all = ["openai>=1.30", "anthropic>=0.40", "boto3>=1.34", "google-generativeai>=0.8", "httpx[socks]>=0.23", "psutil>=5.9", "faiss-cpu>=1.7", "cryptography>=41.0", "tiktoken>=0.7", "fal-client>=0.5", "pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "textual>=0.60", "playwright>=1.40"]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]
skills = [
    "duckduckgo_search>=7.0",
    "trafilatura>=2.0",
    "feedparser>=6.0",
    "croniter>=1.4",
    "caldav>=1.3",
    "icalendar>=5.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "edge-tts>=7.0",
    "faster-whisper>=1.0",
    "psutil>=5.9",
]

[project.scripts]
echo-agent = "echo_agent.__main__:main"

[project.entry-points."echo_agent.plugins"]
# External plugins register here via their own pyproject.toml

[tool.hatch.build]
include = [
    "echo_agent/**/*.py",
    "echo_agent/config/**/*.yaml",
    "echo_agent/gateway/static/**/*",
    "skills/**/*.md",
    "skills/**/*.py",
    "skills/**/*.sh",
    "README.md",
    "LICENSE",
    "scripts/install.sh",
    "hatch_build.py",
]

[tool.hatch.build.targets.wheel]
packages = ["echo_agent"]

[tool.hatch.build.targets.wheel.sources]
"echo_agent" = "echo_agent"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "echo_agent/_bundled/skills"

# web/dist → echo_agent/_bundled/dashboard is injected by hatch_build.py
# only when web/dist exists (see DashboardAssetsHook). This keeps
# `pip install -e .` working in CI / fresh clones before the frontend
# has been built, while production wheels built via scripts/publish.sh
# still bundle the complete dashboard. The hook is registered at the
# project level so it runs for both the wheel and the sdist target —
# this keeps `python -m build` (sdist → wheel round-trip) producing a
# dashboard-bundled wheel, just like `hatch build` does directly.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "echo_agent/",
    "skills/",
    "scripts/install.sh",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "hatch_build.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
# Tests mark async cases explicitly with @pytest.mark.asyncio (strict mode).
asyncio_mode = "strict"
testpaths = ["tests"]
# Coverage is opt-in (it ~3.5x's run time): `pytest --cov`. When enabled, the
# gate in [tool.coverage.report] (fail_under) is enforced automatically.

[tool.coverage.run]
source = ["echo_agent"]
branch = true

[tool.coverage.report]
# Baseline measured at 77%; gate set just under it to absorb noise while
# preventing regressions. Raise this as coverage improves.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
