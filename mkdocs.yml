site_name: Echo Agent
site_url: https://fuyuxiang.github.io/echo-agent
site_description: 自托管、长期运行、带记忆和技能演化能力的 AI Agent Runtime
site_author: Echo Agent contributors
repo_url: https://github.com/fuyuxiang/echo-agent
repo_name: fuyuxiang/echo-agent
copyright: Copyright &copy; 2024-2026 Echo Agent contributors

# Reusable snippets are source fragments, not standalone documentation pages.
# They stay readable by pymdownx.snippets below but must not be emitted or
# reported as pages missing from the navigation.
exclude_docs: |
  includes/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: Echo Agent
          nav_translations:
            首页: Home
            开始使用: Getting Started
            安装: Installation
            快速开始: Quickstart
            升级与卸载: Upgrade & Uninstall
            使用指南: Guides
            模型接入: Models
            Provider 总览: Provider Overview
            本地模型: Local Models
            路由与 Fallback: Routing & Fallback
            工具与权限: Tools & Permissions
            执行后端: Execution Backends
            浏览器与媒体: Browser & Media
            记忆管理: Memory Management
            知识库: Knowledge Base
            会话: Sessions
            任务与规划: Tasks & Planning
            定时任务: Scheduled Jobs
            Dashboard: Dashboard
            成本控制: Cost Control
            核心概念: Concepts
            架构总览: Architecture
            Agent 循环: Agent Loop
            事件与投递: Events & Delivery
            工作区、会话与身份: Workspace, Session & Identity
            记忆系统: Memory System
            上下文压缩与 Spill: Context Compression & Spill
            Skill、Tool 与 Plugin: Skills, Tools & Plugins
            安全模型: Security Model
            进化与评估: Evolution & Evaluation
            多 Agent: Multi-Agent
            集成与扩展: Integrations
            通道总览: Channels Overview
            Gateway: Gateway
            认证: Authentication
            反向代理: Reverse Proxy
            使用 Skill: Using Skills
            Skill 目录: Skill Catalog
            使用 Plugin: Using Plugins
            开发 Plugin: Developing Plugins
            部署与运维: Operations
            运行模式: Runtime Modes
            后台服务: Background Service
            部署: Deployment
            安全加固: Security Hardening
            备份与恢复: Backup & Restore
            升级与迁移: Upgrade & Migrations
            可观测性: Observability
            性能: Performance
            故障排查: Troubleshooting
            参考手册: Reference
            CLI 参考: CLI Reference
            TUI 命令: TUI Commands
            配置参考: Configuration Reference
            配置指南: Configuration Guide
            环境变量: Environment Variables
            工具矩阵: Tools Matrix
            安全 Profile 矩阵: Security Profile Matrix
            Gateway API: Gateway API
            WebSocket 协议: WebSocket Protocol
            文件布局: Filesystem Layout
            兼容性: Compatibility
            术语表: Glossary
            参与开发: Development
            开发环境: Dev Setup
            仓库地图: Repository Map
            新增 Provider: Add a Provider
            新增 Tool: Add a Tool
            新增 Channel: Add a Channel
            Skill 开发: Skill Authoring
            Plugin API: Plugin API
            Dashboard 开发: Dashboard Development
            测试与评估: Testing & Evaluation
            文档贡献: Documentation
            发布流程: Release Process

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.mark
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

